<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Urban Sound Diary</title>
  <link rel="stylesheet" href="/src/style/diary.css">
  <script src="/src/i18n.js"></script>
</head>
<body>
<div class="app-shell">

  <!-- ── Title Bar ──────────────────────────────────────── -->
  <header class="diary-header">
    <a href="/" class="diary-home-link" data-i18n="home_back">← Home</a>
    <span class="header-profile">
      <span id="header-username"></span>
      <span class="header-sep">·</span>
      <span id="header-city"></span>
    </span>
    <div class="diary-date-wrap">
      <button class="diary-date-btn" id="diary-date-btn" aria-haspopup="listbox" aria-expanded="false">
        <span id="diary-date"></span>
        <span class="diary-date-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="date-dropdown hidden" id="date-dropdown" role="listbox" aria-label="Select date"></div>
    </div>
  </header>

  <!-- ── Moments Grid ───────────────────────────────────── -->
  <main class="moments-grid" id="moments-grid">
    <button class="add-moment-btn" id="add-moment-btn" aria-label="Add moment">
      <span data-i18n="add_moment_btn">Record a new moment</span>
    </button>
  </main>

  <!-- ── Focus Mode Overlay (capture + review) ──────────── -->
  <div id="focus-mode" class="focus-mode hidden" data-mode="capture"
       role="dialog" aria-modal="true" aria-label="Moment">

    <div class="focus-header">
      <button class="focus-back-btn" id="focus-back-btn" aria-label="Back">
        <img src="/icons/arrowdown.svg" alt="Back">
      </button>
      <div class="focus-header-text">
        <h2 id="focus-title" data-i18n="new_moment">New Moment</h2>
        <div id="review-meta" class="review-only review-meta"></div>
      </div>
    </div>

    <div class="focus-body">

      <!-- ── Record (capture) / Play (review) ── -->
      <section class="record-section">

        <!-- capture-only: record button -->
        <div class="record-btn-wrap capture-only" id="record-btn-wrap">
          <button class="record-btn" id="record-btn" aria-label="Record">
            <img src="/icons/mic-on.svg" alt="Record">
          </button>
        </div>
        <div class="record-timer capture-only" id="record-timer">00:00</div>
        <div class="record-waveform capture-only" id="record-waveform" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <span class="record-label capture-only" id="record-label" data-i18n="tap_to_record">TAP TO RECORD</span>

        <!-- capture preview + review: audio player -->
        <div class="audio-player-row">
          <button class="play-btn" id="play-btn" aria-label="Play">
            <img src="/icons/play-circle.svg" alt="Play">
          </button>
          <span class="play-timer" id="play-timer">0:00</span>
        </div>

        <!-- capture preview: re-record -->
        <button class="rerecord-btn capture-only" id="rerecord-btn">
          <img src="/icons/refresh-cw.svg" alt="">
          <span data-i18n="re_record">Re-record</span>
        </button>

      </section>

      <!-- ── Photo ── -->
      <section class="photo-section">
        <video id="camera-video" autoplay playsinline></video>
        <canvas id="camera-canvas"></canvas>
        <img id="photo-preview" class="photo-preview" alt="Captured photo">

        <button class="camera-capture-btn capture-only" id="capture-photo-btn" data-i18n="take_photo">Take Photo</button>

        <div class="photo-controls capture-only">
          <button class="photo-btn" id="open-camera-btn">
            <img src="/icons/camera.svg" alt="">
            <span data-i18n="add_photo">Add Photo</span>
          </button>
          <button class="photo-btn" id="retake-photo-btn" style="display:none">
            <img src="/icons/refresh-cw.svg" alt="">
            <span data-i18n="retake">Retake</span>
          </button>
        </div>
      </section>

            <!-- ── Metadata ── -->
      <section class="meta-section">

        <div class="meta-row">
          <span class="meta-label" data-i18n="time_label">Time</span>
          <span id="meta-time" class="meta-value">—</span>
        </div>

        <div class="meta-row">
          <span class="meta-label" data-i18n="place_label">Place</span>
          <div class="meta-location-col">
            <input type="text" id="location-name-input"
                   class="location-name-input"
                   data-i18n-placeholder="name_place"
                   placeholder="Name this place…"
                   maxlength="60" autocomplete="off">
            <span id="meta-coords" class="meta-coords">—</span>
          </div>
        </div>

        <div class="meta-row meta-row--tags">
          <span class="meta-label" data-i18n="tag_label">Tags</span>
          <div class="tag-options" id="tag-options">
            <label class="tag-pill"><input type="checkbox" value="on_the_way"><span data-i18n="tag_on_the_way">On the way</span></label>
            <label class="tag-pill"><input type="checkbox" value="open_space"><span data-i18n="tag_open_space">Open space</span></label>
            <label class="tag-pill"><input type="checkbox" value="commercial"><span data-i18n="tag_commercial">Commercial space</span></label>
            <label class="tag-pill"><input type="checkbox" value="historical"><span data-i18n="tag_historical">Historical place</span></label>
            <label class="tag-pill tag-pill--special">
              <input type="checkbox" value="special" id="tag-special-cb">
              <span data-i18n="tag_special">Place special to me</span>
              <input type="text" id="tag-special-text" class="tag-special-input"
                     data-i18n-placeholder="tag_special_placeholder" placeholder="Describe…" maxlength="60">
            </label>
          </div>
        </div>

      </section>


      <!-- ── Text ── -->
      <section class="text-section">
        <label for="moment-text" id="moment-text-label" data-i18n="what_hear">Describe what you recorded:</label>
        <textarea
          id="moment-text"
          data-i18n-placeholder="describe_moment"
          placeholder="Describe this moment..."
          rows="3"
        ></textarea>
      </section>

      <!-- ── Feel ── -->
      <section class="text-section">
        <label for="moment-feel" data-i18n="what_feel">Describe what you feel about the sound (max 100 chars):</label>
        <textarea
          id="moment-feel"
          data-i18n-placeholder="describe_feel"
          placeholder="Describe what you feel about this moment..."
          rows="3"
        ></textarea>
      </section>

      <!-- ── Save (capture only) ── -->
      <section class="save-section capture-only">
        <button class="save-btn" id="save-btn" disabled data-i18n="save_moment">Save Moment</button>
        <p class="save-hint" id="save-hint" data-i18n="record_to_save">Record audio to save</p>
      </section>

      <!-- ── Delete / Save changes (review only) ── -->
      <section class="delete-section review-only">
        <button class="save-changes-btn" id="save-changes-btn" data-i18n="save_changes">Save Changes</button>
        <button class="delete-btn" id="delete-btn" data-i18n="delete_moment">Delete Moment</button>
      </section>

    </div>
  </div>

  <footer class="diary-footer">
    <span data-i18n="footer_title">Urban Sound Diary</span>
  </footer>

  <script type="module" src="/src/scripts/diary.js"></script>
</div><!-- /.app-shell -->
</body>
</html>
