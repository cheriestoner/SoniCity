<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City A Sound Archive</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="/src/style/archive.css">
    <link rel="preload" href="/public/asset/font/ark-pixel-12px-monospaced-zh_cn.otf" as="font" type="font/otf" crossorigin>
    <style>
        .view-toggle { margin: 16px 0; }
        .toggle-buttons { display: flex; gap: 8px; margin-top: 8px; }
        .view-btn {
            font-family: 'ark-pixel', monospace;
            border-radius: 4px;
            border: 2px solid #000;
            background: #fff;
            cursor: pointer;
            padding: 6px 14px;
            font-size: clamp(11px, 1.2vw, 14px);
        }
        .view-btn.active { background: #000; color: #fff; }
        .timeline-day-label {
            font-family: 'ark-pixel', monospace;
            font-size: clamp(9px, 1vw, 12px);
            fill: #555;
            text-anchor: middle;
        }
        .timeline-user-label {
            font-family: 'ark-pixel', monospace;
            font-size: clamp(9px, 1vw, 12px);
            fill: #555;
            text-anchor: end;
        }
        .timeline-grid-line {
            stroke: #ccc;
            stroke-width: 1;
            stroke-dasharray: 4,4;
        }
        .image-button {
            transition: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="sidebar1">
            <div class="sidebar-header">
                <h2>City A</h2>
                <a href="/" class="home-link">← Home</a>
            </div>
            <div id="image-title"></div>
            <div id="image-time"></div>
            <div id="image-bgc"></div>
            <div id="player" class="player elements">
                <span id="image-audio"></span>
            </div>
            <div id="image-describ" style="margin-bottom: 50px;"></div>
        </div>
        <button id="toggle-sidebar1">&lt;</button>

        <div id="sidebar2">
            <div class="sidebar2-body">
                <h2>City A Sound Archive</h2>
                <p>A collective sound diary — three participants recording 1–3 moments each day over seven days in City A.</p>

                <div class="view-toggle">
                    <label class="ai-label">View</label>
                    <div class="toggle-buttons">
                        <button id="view-scatter" class="view-btn active">Scatter</button>
                        <button id="view-timeline" class="view-btn">Timeline</button>
                        <button id="view-clock" class="view-btn">Clock</button>
                    </div>
                </div>
            </div>
            <div class="sidebar2-footer">
                <img src="/asset/logos/Logo-1.png" alt="Logo" class="sidebar2-logo primary">
                <img src="/asset/logos/SSG-Logo-v1-black.svg" alt="SSG Logo" class="sidebar2-logo secondary">
            </div>
        </div>
        <button id="toggle-sidebar2">&gt;</button>

        <button id="reset-canvas">O</button>
    </div>
    <script>
        const sidebar1 = d3.select("#sidebar1");
        const sidebar2 = d3.select("#sidebar2");
        const toggleButton1 = d3.select("#toggle-sidebar1");
        const toggleButton2 = d3.select("#toggle-sidebar2");
        let sidebar1Visible = true;
        let sidebar2Visible = true;

        toggleButton1.on("click", () => {
            sidebar1Visible = !sidebar1Visible;
            sidebar1.classed("hidden", !sidebar1Visible);
            toggleButton1.classed("hidden", !sidebar1Visible);
            toggleButton1.text(sidebar1Visible ? "<" : ">");
            centerResetButton();
        });
        toggleButton2.on("click", () => {
            sidebar2Visible = !sidebar2Visible;
            sidebar2.classed("hidden", !sidebar2Visible);
            toggleButton2.classed("hidden", !sidebar2Visible);
            toggleButton2.text(sidebar2Visible ? ">" : "<");
            centerResetButton();
        });

        // canvas container size
        const width = window.innerWidth * 0.96;
        const height = window.innerHeight * 0.94;
        const buttonSize = Math.max(60, Math.min(120, Math.floor(Math.min(width, height) * 0.07)));

        const svg = d3.select("#canvas-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        svg.append("rect")
            .attr("id", "canvas-border")
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", width)
            .attr("height", height);

        // Timeline grid group (hidden by default)
        const timelineGrid = svg.append("g")
            .attr("id", "timeline-grid")
            .style("display", "none");

        // Clock grid group (hidden by default)
        const clockGrid = svg.append("g")
            .attr("id", "clock-grid")
            .style("display", "none");

        const g = svg.append("g");

        // Deterministic PRNG utilities (seeded)
        function cyrb128(str) {
            let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
            for (let i = 0, k; i < str.length; i++) {
                k = str.charCodeAt(i);
                h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
                h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
                h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
                h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
            }
            h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
            h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
            h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
            h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
            return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
        }

        function sfc32(a, b, c, d) {
            return function() {
                a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
                let t = (a + b) | 0;
                a = b ^ (b >>> 9);
                b = (c + (c << 3)) | 0;
                c = (c << 21) | (c >>> 11);
                d = (d + 1) | 0;
                t = (t + d) | 0;
                c = (c + t) | 0;
                return (t >>> 0) / 4294967296;
            };
        }

        function seededRngFromString(seedString) {
            const h = cyrb128(seedString);
            return sfc32(h[0], h[1], h[2], h[3]);
        }

        const defaultSeed = 'sonicity-seed-1';
        const urlSeed = new URLSearchParams(window.location.search).get('seed');
        const savedSeed = window.localStorage.getItem('positionSeed');
        const randomSeed = urlSeed || savedSeed || defaultSeed;
        if (urlSeed) {
            window.localStorage.setItem('positionSeed', urlSeed);
        }

        // Compute visible bounds accounting for sidebars
        function computeVisibleBounds() {
            const leftSidebarSpace = sidebar1Visible ? (sidebar1.node()?.offsetWidth || 0) : 0;
            const rightSidebarSpace = sidebar2Visible ? (sidebar2.node()?.offsetWidth || 0) : 0;
            const leftBound = leftSidebarSpace;
            const rightBound = width - rightSidebarSpace;
            const visibleWidth = Math.max(0, rightBound - leftBound);
            const midX = leftBound + visibleWidth / 2;
            return { leftBound, rightBound, visibleWidth, midX };
        }

        function centerResetButton() {
            const { leftBound, rightBound } = computeVisibleBounds();
            const midX = leftBound + (rightBound - leftBound) / 2;
            const resetBtn = document.getElementById("reset-canvas");
            if (resetBtn) {
                resetBtn.style.left = `${Math.round(midX - resetBtn.offsetWidth / 2)}px`;
            }
        }
        centerResetButton();

        // User index for timeline rows
        const userIndex = { alice: 0, bob: 1, carol: 2 };
        const userLabels = ['alice', 'bob', 'carol'];
        const numDays = 7;
        const numUsers = 3;
        const dayDates = new Array(numDays).fill('');

        // Build timeline grid SVG elements (lines + labels)
        // Called once after data loads so we know visibleBounds
        function buildTimelineGrid() {
            timelineGrid.selectAll("*").remove();
            const { leftBound, rightBound, visibleWidth } = computeVisibleBounds();
            const cellW = visibleWidth / numDays;
            const labelPad = 4;

            // Vertical dividers between day columns
            for (let d = 1; d < numDays; d++) {
                const x = leftBound + d * cellW;
                timelineGrid.append("line")
                    .attr("class", "timeline-grid-line")
                    .attr("x1", x).attr("y1", 0)
                    .attr("x2", x).attr("y2", height);
            }

            // Horizontal dividers every 6 hours
            [6, 12, 18].forEach(h => {
                const y = (h / 24) * height;
                timelineGrid.append("line")
                    .attr("class", "timeline-grid-line")
                    .attr("x1", leftBound).attr("y1", y)
                    .attr("x2", rightBound).attr("y2", y);
            });

            // Day / date labels along top
            for (let d = 0; d < numDays; d++) {
                timelineGrid.append("text")
                    .attr("class", "timeline-day-label")
                    .attr("x", leftBound + d * cellW + cellW / 2)
                    .attr("y", 16)
                    .text(dayDates[d] || `Day ${d + 1}`);
            }

            // Time-of-day labels on left
            ['00:00', '06:00', '12:00', '18:00', '24:00'].forEach((label, i) => {
                timelineGrid.append("text")
                    .attr("class", "timeline-user-label")
                    .attr("x", leftBound - labelPad)
                    .attr("y", (i / 4) * height + 4)
                    .text(label);
            });
        }

        // Build clock quadrant labels
        function buildClockGrid() {
            clockGrid.selectAll("*").remove();
            const { leftBound, visibleWidth } = computeVisibleBounds();
            const cx = leftBound + visibleWidth / 2;
            const cy = height / 2;
            const r  = Math.min(visibleWidth, height) * 0.35;
            const lo = r * 0.65; // label offset from center

            const quadrants = [
                { label: 'Morning',   angle: Math.PI * 0.5  },  // top-right (π/4 from top = 45°)
                { label: 'Afternoon', angle: Math.PI * 1.0  },  // bottom-right
                { label: 'Evening',   angle: Math.PI * 1.5  },  // bottom-left
                { label: 'Night',     angle: Math.PI * 2.0  },  // top-left (= 0 wraps, use 7π/4)
            ];
            // Angles measured clockwise from top: morning=45°, afternoon=135°, evening=225°, night=315°
            const angles = [Math.PI * 0.25, Math.PI * 0.75, Math.PI * 1.25, Math.PI * 1.75];
            const names  = ['Morning', 'Afternoon', 'Evening', 'Night'];

            names.forEach((name, i) => {
                const a = angles[i];
                clockGrid.append("text")
                    .attr("x", cx + lo * Math.sin(a))
                    .attr("y", cy - lo * Math.cos(a) + 4)
                    .attr("text-anchor", "middle")
                    .attr("class", "timeline-day-label")
                    .style("font-size", "clamp(11px, 1.2vw, 15px)")
                    .style("fill", "#bbb")
                    .text(name);
            });
        }

        // Compute clock position for a button from its time field
        function computeClockPos(img) {
            const { leftBound, visibleWidth } = computeVisibleBounds();
            const cx = leftBound + visibleWidth / 2;
            const cy = height / 2;
            const r  = Math.min(visibleWidth, height) * 0.35;

            // Parse hh:mm
            const parts = (img.time || '12:00').split(':');
            const totalMinutes = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            // 06:00 maps to angle 0 (top), clockwise
            const adjusted = (totalMinutes - 360 + 1440) % 1440;
            const angle = (adjusted / 1440) * 2 * Math.PI;

            const baseX = cx + r * Math.sin(angle);
            const baseY = cy - r * Math.cos(angle);

            // Seeded jitter: consume 4 RNG calls (scatter x/y + timeline jx/jy) then use 2 more
            const idKey = (img.audio || img.src || img.title);
            const rng = seededRngFromString(`${randomSeed}|${idKey}`);
            rng(); rng(); rng(); rng(); // consume prior calls
            const jr = (rng() - 0.5) * 2 * r * 0.12;
            const jt = (rng() - 0.5) * 0.15;

            const clockLeft = Math.round(baseX + jr * Math.sin(angle) + jt * Math.cos(angle) * r - buttonSize / 2);
            const clockTop  = Math.round(baseY - jr * Math.cos(angle) + jt * Math.sin(angle) * r - buttonSize / 2);

            return { clockLeft, clockTop };
        }

        // Compute timeline position for a button (X = day column, Y = time of day)
        function computeTimelinePos(img) {
            const { leftBound, visibleWidth } = computeVisibleBounds();
            const cellW = visibleWidth / numDays;
            const dIdx = Math.max(0, parseInt(img.day, 10) - 1);

            // X: center button in its day column
            const baseLeft = leftBound + dIdx * cellW + (cellW - buttonSize) / 2;

            // Y: map hh:mm → 0–1440 minutes → pixel position
            const parts = (img.time || '12:00').split(':');
            const totalMinutes = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            const baseTop = (totalMinutes / 1440) * height - buttonSize / 2;

            // Seeded jitter: consume scatter x/y, use 3rd call for horizontal jitter only
            const idKey = (img.audio || img.src || img.title);
            const rng = seededRngFromString(`${randomSeed}|${idKey}`);
            rng(); rng();
            const jx = (rng() - 0.5) * 2 * cellW * 0.2;
            rng(); // consume 4th call (clock view uses calls 5&6)

            return {
                timelineLeft: Math.round(baseLeft + jx),
                timelineTop:  Math.round(baseTop)
            };
        }

        // View state
        let currentView = 'scatter';

        function setView(view) {
            currentView = view;
            const isTimeline = view === 'timeline';
            const isClock    = view === 'clock';

            if (isTimeline) buildTimelineGrid();
            if (isClock)    buildClockGrid();

            timelineGrid.style("display", isTimeline ? null : "none");
            clockGrid.style("display",    isClock    ? null : "none");

            document.querySelectorAll(".image-button").forEach(btn => {
                let targetLeft, targetTop;
                if (isTimeline) {
                    targetLeft = parseInt(btn.dataset.timelineLeft);
                    targetTop  = parseInt(btn.dataset.timelineTop);
                } else if (isClock) {
                    targetLeft = parseInt(btn.dataset.clockLeft);
                    targetTop  = parseInt(btn.dataset.clockTop);
                } else {
                    targetLeft = parseInt(btn.dataset.initLeft);
                    targetTop  = parseInt(btn.dataset.initTop);
                }
                const dx = targetLeft - parseInt(btn.dataset.initLeft);
                const dy = targetTop  - parseInt(btn.dataset.initTop);
                btn.style.transition = 'transform 0.5s ease';
                btn.style.transform  = `translate(${dx}px, ${dy}px)`;

                const audioSrc = btn.dataset.audioSrc;
                if (audioSrc) {
                    const slider = document.querySelector(`input[data-src='${audioSrc}']`);
                    if (slider) {
                        slider.style.transition = 'transform 0.5s ease';
                        slider.style.transform  = `translate(${dx}px, ${dy}px)`;
                    }
                }
            });

            document.getElementById('view-scatter').classList.toggle('active', view === 'scatter');
            document.getElementById('view-timeline').classList.toggle('active', isTimeline);
            document.getElementById('view-clock').classList.toggle('active', isClock);
        }

        document.getElementById('view-scatter').addEventListener('click', () => setView('scatter'));
        document.getElementById('view-timeline').addEventListener('click', () => setView('timeline'));
        document.getElementById('view-clock').addEventListener('click', () => setView('clock'));

        d3.csv("imagedata-cityA.csv").then(images => {
            const { leftBound, rightBound } = computeVisibleBounds();
            images.forEach((img, index) => {
                const button = document.createElement("button");
                button.style.position = "absolute";
                const padding = 10;
                const minLeft = leftBound + padding;
                const maxLeft = rightBound - buttonSize - padding;
                const minTop = padding;
                const maxTop = height - buttonSize - padding;

                const idKey = (img.audio || img.src || String(index));
                const rng = seededRngFromString(`${randomSeed}|${idKey}`);
                const xRand = rng();
                const yRand = rng();
                const computedLeft = Math.floor(minLeft + (maxLeft - minLeft) * xRand);
                const computedTop  = Math.floor(minTop  + (maxTop  - minTop)  * yRand);

                const dIdx = Math.max(0, parseInt(img.day, 10) - 1);
                if (img.date) dayDates[dIdx] = img.date;

                const { timelineLeft, timelineTop } = computeTimelinePos(img);
                const { clockLeft, clockTop }       = computeClockPos(img);

                button.classList.add("image-button");
                button.dataset.initLeft     = String(computedLeft);
                button.dataset.initTop      = String(computedTop);
                button.dataset.timelineLeft = String(timelineLeft);
                button.dataset.timelineTop  = String(timelineTop);
                button.dataset.clockLeft    = String(clockLeft);
                button.dataset.clockTop     = String(clockTop);
                button.dataset.audioSrc     = img.audio;
                button.style.left   = `${computedLeft}px`;
                button.style.top    = `${computedTop}px`;
                button.style.width  = `${buttonSize}px`;
                button.style.height = `${buttonSize}px`;
                if (img.src) button.style.backgroundImage = `url(${img.src})`;
                button.style.opacity = 0.5;

                let pointerDragging = false;
                button.addEventListener("pointerdown", (event) => {
                    event.preventDefault();
                    pointerDragging = false;
                    const startX = event.clientX;
                    const startY = event.clientY;
                    const m = new DOMMatrix(getComputedStyle(button).transform);
                    const baseDx = m.m41;
                    const baseDy = m.m42;
                    button.setPointerCapture(event.pointerId);

                    const onMove = (e) => {
                        const dx = e.clientX - startX;
                        const dy = e.clientY - startY;
                        if (!pointerDragging && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
                            pointerDragging = true;
                        }
                        if (pointerDragging) {
                            button.style.transition = 'none';
                            button.style.transform  = `translate(${baseDx + dx}px, ${baseDy + dy}px)`;
                            const slider = document.querySelector(`input[data-src='${img.audio}']`);
                            if (slider) {
                                slider.style.transition = 'none';
                                slider.style.transform  = `translate(${baseDx + dx}px, ${baseDy + dy}px)`;
                            }
                        }
                    };
                    const onUp = () => {
                        button.removeEventListener("pointermove", onMove);
                        button.removeEventListener("pointerup",   onUp);
                    };
                    button.addEventListener("pointermove", onMove);
                    button.addEventListener("pointerup",   onUp);
                });

                button.addEventListener("click", () => {
                    if (pointerDragging) return;
                    if (!sidebar1Visible) {
                        sidebar1Visible = false;
                        sidebar1.classed("hidden", true);
                        toggleButton1.classed("hidden", true);
                        toggleButton1.text("<");
                    }
                    if (!sidebar2Visible) {
                        sidebar2Visible = false;
                        sidebar2.classed("hidden", true);
                        toggleButton2.classed("hidden", true);
                        toggleButton2.text(">");
                    }
                    d3.select("#image-title").html(`<p>${img.title}</p>`);
                    d3.select("#image-time").html(img.time ? `<p>${img.time}</p>` : '');
                    d3.select("#image-bgc").html(img.bgc ? `<img src="${img.bgc}" class="selected-image">` : '');
                    d3.select("#image-describ").html(`<p>${img.describ}</p>`);

                    let existingAudio  = document.querySelector(`audio[data-src='${img.audio}']`);
                    let volumeSlider   = document.querySelector(`input[data-src='${img.audio}']`);
                    let panLabel       = document.querySelector(`label[data-pan-src='${img.audio}']`);
                    let leftLabel      = document.querySelector(`label[data-left-src='${img.audio}']`);
                    let panSlider      = document.querySelector(`input[data-pan-src='${img.audio}']`);
                    let rightLabel     = document.querySelector(`label[data-right-src='${img.audio}']`);
                    let lowpassLabel   = document.querySelector(`label[data-low-src='${img.audio}']`);
                    let lowpassSlider  = document.querySelector(`input[data-lowpass-src='${img.audio}']`);
                    let highpassLabel  = document.querySelector(`label[data-high-src='${img.audio}']`);
                    let highpassSlider = document.querySelector(`input[data-highpass-src='${img.audio}']`);

                    document.querySelectorAll("label[data-pan-src]").forEach(label => {
                        document.getElementById("sidebar1").removeChild(label);
                    });
                    document.querySelectorAll("label[data-left-src]").forEach(label => {
                        document.getElementById("sidebar1").removeChild(label);
                    });
                    document.querySelectorAll("input[data-pan-src]").forEach(slider => {
                        document.getElementById("sidebar1").removeChild(slider);
                    });
                    document.querySelectorAll("label[data-right-src]").forEach(label => {
                        document.getElementById("sidebar1").removeChild(label);
                    });
                    document.querySelectorAll("label[data-low-src]").forEach(label => {
                        document.getElementById("sidebar1").removeChild(label);
                    });
                    document.querySelectorAll("input[data-lowpass-src]").forEach(slider => {
                        document.getElementById("sidebar1").removeChild(slider);
                    });
                    document.querySelectorAll("label[data-high-src]").forEach(label => {
                        document.getElementById("sidebar1").removeChild(label);
                    });
                    document.querySelectorAll("input[data-highpass-src]").forEach(slider => {
                        document.getElementById("sidebar1").removeChild(slider);
                    });

                    if (!existingAudio) {
                        let audioElement = document.createElement("audio");
                        audioElement.src = img.audio;
                        audioElement.setAttribute("data-src", img.audio);
                        audioElement.loop = true;
                        audioElement.volume = 1;
                        document.body.appendChild(audioElement);
                        audioElement.play();
                        button.dataset.playing = 'true';
                        button.style.animation = "pulse 2s infinite";

                        let slider = document.createElement("input");
                        slider.type = "range";
                        slider.min = "0";
                        slider.max = "1";
                        slider.step = "0.01";
                        slider.value = "1";
                        slider.setAttribute("data-src", img.audio);
                        slider.style.position = "absolute";
                        slider.style.left = button.style.left;
                        slider.style.top  = `${parseInt(button.dataset.initTop) + buttonSize + 10}px`;
                        slider.style.transform = button.style.transform;
                        slider.style.width = `${buttonSize}px`;
                        document.getElementById("canvas-container").appendChild(slider);

                        slider.addEventListener("input", (event) => {
                            audioElement.volume = event.target.value;
                        });

                        let panLabelEl = document.createElement("label");
                        panLabelEl.innerText = "PAN";
                        panLabelEl.style.fontFamily = "ark-pixel";
                        panLabelEl.style.display = "block";
                        panLabelEl.setAttribute("data-pan-src", img.audio);
                        document.getElementById("sidebar1").appendChild(panLabelEl);

                        let leftLabelEl = document.createElement("label");
                        leftLabelEl.innerText = "left";
                        leftLabelEl.style.fontFamily = "ark-pixel";
                        leftLabelEl.setAttribute("data-left-src", img.audio);
                        document.getElementById("sidebar1").appendChild(leftLabelEl);

                        let panSliderEl = document.createElement("input");
                        panSliderEl.type = "range";
                        panSliderEl.min = "-1";
                        panSliderEl.max = "1";
                        panSliderEl.step = "0.01";
                        panSliderEl.value = "0";
                        panSliderEl.setAttribute("data-pan-src", img.audio);
                        panSliderEl.classList.add("control-slider");
                        document.getElementById("sidebar1").appendChild(panSliderEl);

                        let rightLabelEl = document.createElement("label");
                        rightLabelEl.innerText = "right";
                        rightLabelEl.style.fontFamily = "ark-pixel";
                        rightLabelEl.setAttribute("data-right-src", img.audio);
                        document.getElementById("sidebar1").appendChild(rightLabelEl);

                        let lowpassLabelEl = document.createElement("label");
                        lowpassLabelEl.innerText = "LOWPASS FILTER";
                        lowpassLabelEl.style.fontFamily = "ark-pixel";
                        lowpassLabelEl.style.display = "block";
                        lowpassLabelEl.setAttribute("data-low-src", img.audio);
                        document.getElementById("sidebar1").appendChild(lowpassLabelEl);

                        let lowpassSliderEl = document.createElement("input");
                        lowpassSliderEl.type = "range";
                        lowpassSliderEl.min = "1";
                        lowpassSliderEl.max = "10000";
                        lowpassSliderEl.step = "1";
                        lowpassSliderEl.value = "8000";
                        lowpassSliderEl.setAttribute("data-lowpass-src", img.audio);
                        lowpassSliderEl.classList.add("control-slider");
                        document.getElementById("sidebar1").appendChild(lowpassSliderEl);

                        let highpassLabelEl = document.createElement("label");
                        highpassLabelEl.innerText = "HIGHPASS FILTER";
                        highpassLabelEl.style.fontFamily = "ark-pixel";
                        highpassLabelEl.style.display = "block";
                        highpassLabelEl.setAttribute("data-high-src", img.audio);
                        document.getElementById("sidebar1").appendChild(highpassLabelEl);

                        let highpassSliderEl = document.createElement("input");
                        highpassSliderEl.type = "range";
                        highpassSliderEl.min = "1";
                        highpassSliderEl.max = "5000";
                        highpassSliderEl.step = "1";
                        highpassSliderEl.value = "1000";
                        highpassSliderEl.setAttribute("data-highpass-src", img.audio);
                        highpassSliderEl.classList.add("control-slider");
                        document.getElementById("sidebar1").appendChild(highpassSliderEl);

                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const track = audioContext.createMediaElementSource(audioElement);
                        const panner = new StereoPannerNode(audioContext, { pan: 0 });
                        const lowpassFilter  = new BiquadFilterNode(audioContext, { type: 'lowpass',  frequency: 8000 });
                        const highpassFilter = new BiquadFilterNode(audioContext, { type: 'highpass', frequency: 1000 });
                        track.connect(panner).connect(lowpassFilter).connect(highpassFilter).connect(audioContext.destination);

                        panSliderEl.addEventListener("input", (event) => {
                            panner.pan.value = event.target.value;
                        });
                        lowpassSliderEl.addEventListener("input", (event) => {
                            lowpassFilter.frequency.value = event.target.value;
                        });
                        highpassSliderEl.addEventListener("input", (event) => {
                            highpassFilter.frequency.value = event.target.value;
                        });

                        audioElement.panner        = panner;
                        audioElement.lowpassFilter  = lowpassFilter;
                        audioElement.highpassFilter = highpassFilter;
                    } else {
                        if (button.dataset.playing !== 'true') {
                            existingAudio.currentTime = 0;
                            existingAudio.play();
                            button.dataset.playing = 'true';
                            button.style.animation = "pulse 2s infinite";

                            if (volumeSlider) {
                                volumeSlider.style.display = "block";
                            } else {
                                let slider = document.createElement("input");
                                slider.type = "range";
                                slider.min = "0"; slider.max = "1"; slider.step = "0.01"; slider.value = "1";
                                slider.setAttribute("data-src", img.audio);
                                slider.style.position = "absolute";
                                slider.style.left  = `${parseInt(button.style.left)}px`;
                                slider.style.top   = `${parseInt(button.style.top) + buttonSize + 10}px`;
                                slider.style.width = `${buttonSize}px`;
                                document.getElementById("canvas-container").appendChild(slider);
                                slider.addEventListener("input", (event) => { existingAudio.volume = event.target.value; });
                            }

                            if (panSlider) {
                                panSlider.style.display  = "block";
                                panLabel.style.display   = "block";
                                leftLabel.style.display  = "block";
                                rightLabel.style.display = "block";
                            } else {
                                let panLabelEl = document.createElement("label");
                                panLabelEl.innerText = "PAN";
                                panLabelEl.style.fontFamily = "ark-pixel"; panLabelEl.style.display = "block";
                                panLabelEl.setAttribute("data-pan-src", img.audio);
                                document.getElementById("sidebar1").appendChild(panLabelEl);

                                let leftLabelEl = document.createElement("label");
                                leftLabelEl.innerText = "left";
                                leftLabelEl.style.fontFamily = "ark-pixel";
                                leftLabelEl.setAttribute("data-left-src", img.audio);
                                document.getElementById("sidebar1").appendChild(leftLabelEl);

                                let panSliderEl = document.createElement("input");
                                panSliderEl.type = "range"; panSliderEl.min = "-1"; panSliderEl.max = "1"; panSliderEl.step = "0.01";
                                panSliderEl.value = existingAudio.panner.pan.value;
                                panSliderEl.setAttribute("data-pan-src", img.audio);
                                panSliderEl.classList.add("control-slider");
                                document.getElementById("sidebar1").appendChild(panSliderEl);

                                let rightLabelEl = document.createElement("label");
                                rightLabelEl.innerText = "right";
                                rightLabelEl.style.fontFamily = "ark-pixel";
                                rightLabelEl.setAttribute("data-right-src", img.audio);
                                document.getElementById("sidebar1").appendChild(rightLabelEl);

                                panSliderEl.addEventListener("input", (event) => { existingAudio.panner.pan.value = event.target.value; });
                            }

                            if (lowpassSlider) {
                                lowpassSlider.style.display = "block";
                            } else {
                                let lowpassLabelEl = document.createElement("label");
                                lowpassLabelEl.innerText = "LOWPASS FILTER";
                                lowpassLabelEl.style.fontFamily = "ark-pixel"; lowpassLabelEl.style.display = "block";
                                lowpassLabelEl.setAttribute("data-low-src", img.audio);
                                document.getElementById("sidebar1").appendChild(lowpassLabelEl);

                                let lowpassSliderEl = document.createElement("input");
                                lowpassSliderEl.type = "range"; lowpassSliderEl.min = "1"; lowpassSliderEl.max = "10000"; lowpassSliderEl.step = "1";
                                lowpassSliderEl.value = existingAudio.lowpassFilter.frequency.value;
                                lowpassSliderEl.setAttribute("data-lowpass-src", img.audio);
                                lowpassSliderEl.classList.add("control-slider");
                                document.getElementById("sidebar1").appendChild(lowpassSliderEl);

                                lowpassSliderEl.addEventListener("input", (event) => { existingAudio.lowpassFilter.frequency.value = event.target.value; });
                            }

                            if (highpassSlider) {
                                highpassSlider.style.display = "block";
                            } else {
                                let highpassLabelEl = document.createElement("label");
                                highpassLabelEl.innerText = "HIGHPASS FILTER";
                                highpassLabelEl.style.fontFamily = "ark-pixel"; highpassLabelEl.style.display = "block";
                                highpassLabelEl.setAttribute("data-high-src", img.audio);
                                document.getElementById("sidebar1").appendChild(highpassLabelEl);

                                let highpassSliderEl = document.createElement("input");
                                highpassSliderEl.type = "range"; highpassSliderEl.min = "1"; highpassSliderEl.max = "5000"; highpassSliderEl.step = "1";
                                highpassSliderEl.value = existingAudio.highpassFilter.frequency.value;
                                highpassSliderEl.setAttribute("data-highpass-src", img.audio);
                                highpassSliderEl.classList.add("control-slider");
                                document.getElementById("sidebar1").appendChild(highpassSliderEl);

                                highpassSliderEl.addEventListener("input", (event) => { existingAudio.highpassFilter.frequency.value = event.target.value; });
                            }
                        } else {
                            existingAudio.pause();
                            button.dataset.playing = 'false';
                            button.style.animation = "";
                            button.style.opacity = 0.5;
                            if (volumeSlider) { volumeSlider.style.display = "none"; }
                        }
                    }
                });

                document.getElementById("canvas-container").appendChild(button);
            });
        });

        window.addEventListener('resize', () => {
            centerResetButton();
        });

        d3.select("#reset-canvas").on("click", () => {
            // stop and remove all audio
            document.querySelectorAll("audio").forEach(audio => {
                try { audio.pause(); } catch(_) {}
                if (audio.parentElement) { audio.parentElement.removeChild(audio); }
            });
            // clear button styles and restore scatter positions
            document.querySelectorAll(".image-button").forEach(btn => {
                btn.style.transition = 'none';
                btn.style.transform  = 'translate(0,0)';
                btn.style.animation  = "";
                btn.style.opacity    = 0.5;
                btn.dataset.playing  = 'false';
            });
            // remove volume sliders on canvas
            document.querySelectorAll("#canvas-container input[type='range']").forEach(slider => slider.remove());
            // remove sliders and labels in sidebar1
            document.querySelectorAll("#sidebar1 input[type='range']").forEach(slider => slider.remove());
            document.querySelectorAll("#sidebar1 label").forEach(label => label.remove());
            // clear sidebar1 info
            d3.select("#image-title").html("");
            d3.select("#image-time").html("");
            d3.select("#image-bgc").html("");
            d3.select("#image-describ").html("");
            d3.select("#image-audio").html("");
            // return to scatter view
            setView('scatter');
        });
    </script>
</body>
</html>
