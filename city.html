<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Diary</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="/src/i18n.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="/src/style/archive.css">
    <link rel="preload" href="/public/asset/font/ark-pixel-12px-monospaced-zh_cn.otf" as="font" type="font/otf" crossorigin>
    <style>
        .view-toggle { margin: 0 0 12px; }
        .toggle-buttons { display: flex; justify-content: center; gap: 8px; margin-top: 0; flex-wrap: wrap; }
        .view-btn {
            font-family: 'ark-pixel', monospace;
            border-radius: 4px;
            border: 2px solid #000;
            background: #fff;
            cursor: pointer;
            padding: 6px 14px;
            font-size: clamp(15px, 1.25vw, 21px);
        }
        .view-btn.active { background: #000; color: #fff; }
        .timeline-day-label {
            font-family: 'ark-pixel', monospace;
            font-size: clamp(14px, 1.2vw, 20px);
            fill: #777;
            text-anchor: middle;
        }
        .timeline-user-label {
            font-family: 'ark-pixel', monospace;
            font-size: clamp(14px, 1.2vw, 20px);
            fill: #777;
            text-anchor: start;
        }
        .timeline-grid-line {
            stroke: #ccc;
            stroke-width: 1;
            stroke-dasharray: 4,4;
        }
        .image-button {
            transition: none;
        }
        .week-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            margin: 0 0 12px;
            padding: 0;
        }
        #week-nav .ai-label {
            margin-bottom: 0;
            text-align: center;
        }
        #week-label {
            font-size: clamp(16px, 1.15vw, 20px);
            flex: 1;
            text-align: center;
            white-space: nowrap;
        }
        #buttons-layer {
            position: absolute;
            top: 0; left: 0;
            transform-origin: 0 0;
            width: 0; height: 0;
        }
        #feel-labels-layer {
            position: absolute;
            top: 0; left: 0;
            transform-origin: 0 0;
            width: 0; height: 0;
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        .feel-label {
            position: absolute;
            transform: translate(-50%, -50%);
            color: #777;
            font-family: 'fusion-pixel-cn', 'ark-pixel', monospace;
            font-size: clamp(16px, 1.6vw, 24px);
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="sidebar1">
            <div class="sidebar-header">
                <a href="/" class="home-link" data-i18n="home_back">← Home</a>
            </div>
            <div id="image-title">
                <p><strong data-i18n="participant_id_label">Participant ID:</strong> <span id="participant-id-value"></span></p>
            </div>
            <h3 id="moment-details-heading" data-i18n="moment_details_label" hidden>Moment details</h3>
            <div id="image-time"></div>
            <div id="fav-toggle-wrap" style="display:none">
                <button id="fav-toggle" class="view-btn" data-i18n="fav_add">☆ Favorite</button>
            </div>
            <div id="image-bgc"></div>
            <div id="player" class="player elements">
                <span id="image-audio"></span>
            </div>
            <div id="image-describ" style="margin-bottom: 20px;"></div>
        </div>
        <div id="sidebar2">
            <div class="sidebar2-body">
                <h2 data-i18n="city_archive">Sound Diary Archive</h2>
                <p class="archive-intro" data-i18n="archive_desc">Personal and shared sonic traces reveal how people reflect on and reconstruct the everyday soundscapes of Suzhou and Shenzhen.</p>

                <h3 class="archive-controls-heading" data-i18n="explore_archive_label">Explore archive</h3>

                <div id="week-nav" class="week-nav" style="display:none">
                    <label class="ai-label guide-label" tabindex="0" aria-describedby="date-range-guide">
                        <span data-i18n="date_range_label">Date range</span>
                        <span class="guide-mark" aria-hidden="true">?</span>
                        <span id="date-range-guide" class="guide-tooltip" role="tooltip" data-i18n="date_range_guide">Scroll over the timeline with a mouse wheel or trackpad to zoom and select a date range.</span>
                    </label>
                    <span id="week-label"></span>
                </div>

                <div class="view-toggle">
                    <label class="ai-label" data-i18n="view_label">View</label>
                    <div class="toggle-buttons">
                        <button id="view-timeline" class="view-btn active" data-i18n="timeline">Timeline</button>
                        <button id="view-clock" class="view-btn" data-i18n="clock">Clock</button>
                        <button id="view-tag" class="view-btn" data-i18n="tag_view">Tag</button>
                        <button id="view-feel" class="view-btn" data-i18n="feel_view">Feel</button>
                        <button id="view-scatter" class="view-btn" data-i18n="scatter">Scatter</button>
                    </div>
                </div>

                <div class="view-toggle">
                    <label class="ai-label" data-i18n="user_label">User</label>
                    <div class="toggle-buttons" id="user-filter-buttons">
                        <button id="filter-me"     class="view-btn active"  data-i18n="filter_me">Me</button>
                        <button id="filter-all"    class="view-btn"         data-i18n="all">All</button>
                        <button id="filter-others" class="view-btn"         data-i18n="filter_others">Others</button>
                    </div>
                </div>

                <div class="view-toggle">
                    <label class="ai-label" data-i18n="city_label">City</label>
                    <div class="toggle-buttons" id="city-filter-buttons">
                        <button id="filter-suzhou"     class="view-btn active"  data-i18n="filter_suzhou">Suzhou</button>
                        <button id="filter-two-cities" class="view-btn"         data-i18n="filter_two_cities">Two Cities</button>
                        <button id="filter-shenzhen"   class="view-btn"         data-i18n="filter_shenzhen">Shenzhen</button>
                    </div>
                </div>

                <div class="view-toggle">
                    <label class="ai-label" data-i18n="fav_label">Favorites</label>
                    <div class="toggle-buttons" id="fav-filter-buttons">
                        <button id="filter-all-fav"  class="view-btn active" data-i18n="all">All</button>
                        <button id="filter-fav-only" class="view-btn"        data-i18n="fav_filter">★ Fav</button>
                    </div>
                </div>
            </div>
            <div class="sidebar2-footer">
                <img src="/asset/logos/Logo-1.png" alt="Logo" class="sidebar2-logo primary">
                <img src="/asset/logos/SSG-Logo-v1-black.svg" alt="SSG Logo" class="sidebar2-logo secondary">
            </div>
        </div>
        <div id="buttons-layer"></div>
        <div id="feel-labels-layer"></div>
    </div>
    <script>
        const t = key => window.i18n.t(key);
        const currentUser = localStorage.getItem('usd_username') || 'anonymous';
        document.getElementById('participant-id-value').textContent = currentUser;

        const TAG_I18N = {
            on_the_way:  'tag_on_the_way',
            open_space:  'tag_open_space',
            commercial:  'tag_commercial',
            historical:  'tag_historical',
            special:     'tag_special',
        };
        function tagLabel(key) { return key ? t(TAG_I18N[key] || key) : ''; }

        function arrangeControlGroups() {
            const sidebar = document.getElementById('sidebar1');
            sidebar.querySelector('.audio-controls-heading')?.remove();
            const makeTick = text => {
                const tick = document.createElement('span');
                tick.className = 'audio-control-tick';
                tick.textContent = text;
                return tick;
            };
            const buildGroup = (name, title, slider, leftTick, rightTick) => {
                if (!title || !slider) return;
                const group = document.createElement('div');
                group.className = `audio-control-group audio-control-${name}`;
                const endpoints = document.createElement('div');
                endpoints.className = 'audio-control-endpoints';

                sidebar.insertBefore(group, title);
                group.append(title, slider);
                endpoints.append(leftTick, rightTick);
                group.appendChild(endpoints);
            };

            buildGroup(
                'pan',
                sidebar.querySelector('label[data-pan-src]'),
                sidebar.querySelector('input[data-pan-src]'),
                sidebar.querySelector('label[data-left-src]'),
                sidebar.querySelector('label[data-right-src]')
            );
            buildGroup(
                'lowpass',
                sidebar.querySelector('label[data-low-src]'),
                sidebar.querySelector('input[data-lowpass-src]'),
                makeTick('1 Hz'),
                makeTick('10 kHz')
            );
            buildGroup(
                'highpass',
                sidebar.querySelector('label[data-high-src]'),
                sidebar.querySelector('input[data-highpass-src]'),
                makeTick('1 Hz'),
                makeTick('5 kHz')
            );

            const firstControlGroup = sidebar.querySelector('.audio-control-group');
            if (firstControlGroup) {
                const heading = document.createElement('h3');
                heading.className = 'audio-controls-heading guide-label';
                heading.tabIndex = 0;
                heading.setAttribute('aria-describedby', 'audio-controls-guide');

                const headingText = document.createElement('span');
                headingText.dataset.i18n = 'audio_controls_label';
                headingText.textContent = t('audio_controls_label');

                const guideMark = document.createElement('span');
                guideMark.className = 'guide-mark';
                guideMark.setAttribute('aria-hidden', 'true');
                guideMark.textContent = '?';

                const guideTooltip = document.createElement('span');
                guideTooltip.id = 'audio-controls-guide';
                guideTooltip.className = 'guide-tooltip';
                guideTooltip.setAttribute('role', 'tooltip');
                guideTooltip.dataset.i18n = 'audio_controls_guide';
                guideTooltip.textContent = t('audio_controls_guide');

                heading.append(headingText, guideMark, guideTooltip);
                sidebar.insertBefore(heading, firstControlGroup);
            }
        }

        const DISPLAY_TO_KEY = {
            'On the way':          'on_the_way',
            'Open space':          'open_space',
            'Commercial space':    'commercial',
            'Historical place':    'historical',
            'Place special to me': 'special',
        };
        function normalizeTag(raw) { return DISPLAY_TO_KEY[raw] || raw; }

        const FAVE_KEY = 'sonicity_favorites';
        function getFavorites() {
            return new Set(JSON.parse(localStorage.getItem(FAVE_KEY) || '[]'));
        }
        function saveFavorites(set) {
            localStorage.setItem(FAVE_KEY, JSON.stringify([...set]));
        }

        let currentFavFilter = 'all';
        let selectedAudioSrc = null;
        const sidebar1 = d3.select("#sidebar1");
        const sidebar2 = d3.select("#sidebar2");
        let sidebar1Visible = true;
        let sidebar2Visible = true;

        // canvas container size
        const width = window.innerWidth * 0.96;
        const height = window.innerHeight * 0.94;
        let buttonSize = Math.max(60, Math.min(120, Math.floor(Math.min(width, height) * 0.07)));
        const volumeSliderGap = 10;
        const volumeSliderHeight = 16;
        const canvasEdgePadding = 12;

        function positionVolumeSlider(slider, button, targetTop = null) {
            const initLeft = parseFloat(button.dataset.initLeft || button.style.left) || 0;
            const initTop = parseFloat(button.dataset.initTop || button.style.top) || 0;
            let visualTop = targetTop;

            if (visualTop == null) {
                const transform = new DOMMatrix(getComputedStyle(button).transform);
                visualTop = initTop + transform.m42;
            }

            const belowTop = visualTop + buttonSize + volumeSliderGap;
            const fitsBelow = belowTop + volumeSliderHeight <= height - canvasEdgePadding;
            const sliderTop = fitsBelow
                ? initTop + buttonSize + volumeSliderGap
                : initTop - volumeSliderGap - volumeSliderHeight;

            slider.style.position = 'absolute';
            slider.style.left = `${Math.max(canvasEdgePadding, Math.min(initLeft, width - buttonSize - canvasEdgePadding))}px`;
            slider.style.top = `${Math.max(canvasEdgePadding, sliderTop)}px`;
            slider.style.width = `${buttonSize}px`;
            slider.style.transform = button.style.transform;
        }

        const svg = d3.select("#canvas-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        svg.append("rect")
            .attr("id", "canvas-border")
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", width)
            .attr("height", height);

        // Timeline grid group (hidden by default)
        const timelineGrid = svg.append("g")
            .attr("id", "timeline-grid")
            .style("display", "none");

        // Clock grid group (hidden by default)
        const clockGrid = svg.append("g")
            .attr("id", "clock-grid")
            .style("display", "none");

        // Tag cluster grid group (hidden by default)
        const tagGrid = svg.append("g")
            .attr("id", "tag-grid")
            .style("display", "none");

        // Feel cluster grid group (hidden by default)
        const feelGrid = svg.append("g")
            .attr("id", "feel-grid")
            .style("display", "none");

        const g = svg.append("g");

        let zoomTransform = d3.zoomIdentity;
        const zoom = d3.zoom()
            .scaleExtent([0.5, 7])
            .on('zoom', ({ transform }) => {
                zoomTransform = transform;
                if (currentView === 'timeline') {
                    applyTimelineZoom(transform);
                } else {
                    g.attr('transform', transform);
                    clockGrid.attr('transform', transform);
                    tagGrid.attr('transform', transform);
                    feelGrid.attr('transform', transform);
                    const layerTransform = `translate(${transform.x}px,${transform.y}px) scale(${transform.k})`;
                    buttonsLayerEl.style.transform    = layerTransform;
                    feelLabelsLayerEl.style.transform = layerTransform;
                }
            });
        svg.call(zoom);

        // Deterministic PRNG utilities (seeded)
        function cyrb128(str) {
            let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
            for (let i = 0, k; i < str.length; i++) {
                k = str.charCodeAt(i);
                h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
                h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
                h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
                h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
            }
            h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
            h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
            h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
            h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
            return [(h1 ^ h2 ^ h3 ^ h4) >>> 0, (h2 ^ h1) >>> 0, (h3 ^ h1) >>> 0, (h4 ^ h1) >>> 0];
        }

        function sfc32(a, b, c, d) {
            return function() {
                a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
                let t = (a + b) | 0;
                a = b ^ (b >>> 9);
                b = (c + (c << 3)) | 0;
                c = (c << 21) | (c >>> 11);
                d = (d + 1) | 0;
                t = (t + d) | 0;
                c = (c + t) | 0;
                return (t >>> 0) / 4294967296;
            };
        }

        function seededRngFromString(seedString) {
            const h = cyrb128(seedString);
            return sfc32(h[0], h[1], h[2], h[3]);
        }

        const defaultSeed = 'sonicity-seed-1';
        const urlSeed = new URLSearchParams(window.location.search).get('seed');
        const savedSeed = window.localStorage.getItem('positionSeed');
        const randomSeed = urlSeed || savedSeed || defaultSeed;
        if (urlSeed) {
            window.localStorage.setItem('positionSeed', urlSeed);
        }

        // Compute visible bounds accounting for sidebars
        function computeVisibleBounds() {
            const leftSidebarSpace = sidebar1Visible ? (sidebar1.node()?.offsetWidth || 0) : 0;
            const rightSidebarSpace = sidebar2Visible ? (sidebar2.node()?.offsetWidth || 0) : 0;
            const leftBound = leftSidebarSpace;
            const rightBound = width - rightSidebarSpace;
            const visibleWidth = Math.max(0, rightBound - leftBound);
            const midX = leftBound + visibleWidth / 2;
            return { leftBound, rightBound, visibleWidth, midX };
        }

        if (window.innerWidth < 768) {
            sidebar1Visible = false;
            sidebar2Visible = false;
            sidebar1.classed("hidden", true);
            sidebar2.classed("hidden", true);
        }

        // Zoom changes the number of visible days, but the window is always
        // clamped to the 11-day study period (Jun 12–Jun 22).
        function applyTimelineZoom(transform) {
            const newNumDays = Math.max(1, Math.min(
                TIMELINE_NUM_DAYS,
                Math.round(TIMELINE_NUM_DAYS / transform.k)
            ));
            if (newNumDays === numDays) return;

            const currentCenter = timelineStartIndex + (numDays - 1) / 2;
            const nextStart = Math.round(currentCenter - (newNumDays - 1) / 2);
            setTimelineWindow(nextStart, newNumDays);
        }

        function resolveViewOverlaps(viewName, visibleOnly = false) {
            const { leftBound, rightBound, visibleWidth } = computeVisibleBounds();
            const r = buttonSize / 2 + 2;
            const cellW = visibleWidth / numDays;

            const nodes = [];
            document.querySelectorAll('.image-button').forEach(btn => {
                if (visibleOnly && btn.style.display === 'none') return;
                const lk = viewName === 'scatter' ? 'initLeft' : `${viewName}Left`;
                const tk = viewName === 'scatter' ? 'initTop'  : `${viewName}Top`;
                const idealLeft = viewName === 'timeline'
                    ? parseInt(btn.dataset.timelineIdealLeft ?? btn.dataset[lk])
                    : parseInt(btn.dataset[lk]);
                const idealTop = viewName === 'timeline'
                    ? parseInt(btn.dataset.timelineIdealTop ?? btn.dataset[tk])
                    : parseInt(btn.dataset[tk]);
                const x = idealLeft + buttonSize / 2;
                const y = idealTop + buttonSize / 2;
                const node = { x, y, anchorX: x, anchorY: y, btn, lk, tk };
                if (viewName === 'timeline') {
                    const dateIdx = currentWeekMDDates.indexOf(btn.dataset.date);
                    const col = dateIdx >= 0 ? dateIdx : 0;
                    const columnLeft = leftBound + col * cellW;
                    const columnRight = columnLeft + cellW;
                    const horizontalInset = Math.min(r, cellW * 0.25);
                    const maxTimelineDrift = Math.min(height / 16, r * 1.5);
                    node.xMin = columnLeft + horizontalInset;
                    node.xMax = columnRight - horizontalInset;
                    // Keep moments close to their real time while allowing a small
                    // vertical spread when horizontal separation is not enough.
                    // height / 16 equals 90 minutes on the 24-hour axis.
                    node.yMin = Math.max(r, y - maxTimelineDrift);
                    node.yMax = Math.min(height - r, y + maxTimelineDrift);
                } else if (viewName === 'feel') {
                    const feelIdx = FEEL_CATEGORIES.indexOf(btn.dataset.feelCategory || '');
                    const fCol = feelIdx >= 0 ? feelIdx % 2 : -1;
                    const fRow = feelIdx >= 0 ? Math.floor(feelIdx / 2) : -1;
                    const colW = visibleWidth / 2;
                    const rowH = height / 3;
                    if (fCol >= 0 && fRow >= 0) {
                        node.xMin = leftBound + fCol * colW + r;
                        node.xMax = leftBound + (fCol + 1) * colW - r;
                        node.yMin = fRow * rowH + r;
                        node.yMax = (fRow + 1) * rowH - r;
                    } else {
                        node.xMin = leftBound + r;
                        node.xMax = rightBound - r;
                        node.yMin = r;
                        node.yMax = height - r;
                    }
                } else {
                    node.xMin = leftBound + r;
                    node.xMax = rightBound - r;
                    node.yMin = r;
                    node.yMax = height - r;
                }
                nodes.push(node);
            });

            const sim = d3.forceSimulation(nodes)
                .force('collide', d3.forceCollide(r).iterations(4));
            if (viewName === 'timeline') {
                sim
                    .force('x', d3.forceX(d => d.anchorX).strength(0.16))
                    .force('y', d3.forceY(d => d.anchorY).strength(0.32));
            }
            sim.stop();
            for (let i = 0; i < 300; i++) {
                sim.tick();
                nodes.forEach(d => {
                    d.x = Math.max(d.xMin, Math.min(d.xMax, d.x));
                    d.y = Math.max(d.yMin, Math.min(d.yMax, d.y));
                });
            }

            nodes.forEach(({ btn, x, y, lk, tk }) => {
                btn.dataset[lk] = String(Math.round(x - buttonSize / 2));
                btn.dataset[tk] = String(Math.round(y - buttonSize / 2));
                if (lk === 'initLeft') {
                    btn.style.left = btn.dataset.initLeft + 'px';
                    btn.style.top  = btn.dataset.initTop  + 'px';
                }
            });
        }

        // User index for timeline rows
        const userIndex = { alice: 0, bob: 1, carol: 2 };
        const userLabels = ['alice', 'bob', 'carol'];
        const TIMELINE_START_DATE = new Date(2026, 5, 12);
        const TIMELINE_NUM_DAYS = 11;
        let numDays = TIMELINE_NUM_DAYS;
        const numUsers = 3;
        let timelineStartIndex = 0;
        let timelineWindowStart = new Date(TIMELINE_START_DATE);
        let dayDates = Array.from({ length: numDays }, (_, i) => {
            const d = new Date(timelineWindowStart);
            d.setDate(timelineWindowStart.getDate() + i);
            return (d.getMonth() + 1) + '/' + d.getDate();
        });
        let currentWeekMDDates = Array.from({ length: numDays }, (_, i) => {
            const d = new Date(timelineWindowStart);
            d.setDate(timelineWindowStart.getDate() + i);
            return String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        });

        function setTimelineWindow(startIndex, visibleDays) {
            numDays = Math.max(1, Math.min(TIMELINE_NUM_DAYS, Math.round(visibleDays)));
            const maxStart = TIMELINE_NUM_DAYS - numDays;
            timelineStartIndex = Math.max(0, Math.min(maxStart, Math.round(startIndex)));
            timelineWindowStart = new Date(TIMELINE_START_DATE);
            timelineWindowStart.setDate(TIMELINE_START_DATE.getDate() + timelineStartIndex);

            dayDates = Array.from({ length: numDays }, (_, i) => {
                const d = new Date(timelineWindowStart);
                d.setDate(timelineWindowStart.getDate() + i);
                return (d.getMonth() + 1) + '/' + d.getDate();
            });
            currentWeekMDDates = Array.from({ length: numDays }, (_, i) => {
                const d = new Date(timelineWindowStart);
                d.setDate(timelineWindowStart.getDate() + i);
                return String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            });

            const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const endDay = new Date(timelineWindowStart);
            endDay.setDate(timelineWindowStart.getDate() + numDays - 1);
            const label = document.getElementById('week-label');
            if (label) {
                label.textContent = numDays === 1
                    ? fmt(timelineWindowStart)
                    : fmt(timelineWindowStart) + ' – ' + fmt(endDay);
            }

            document.querySelectorAll('.image-button').forEach(btn => {
                if (!btn._imgData) return;
                const { timelineLeft, timelineTop } = computeTimelinePos(btn._imgData);
                btn.dataset.timelineIdealLeft = String(timelineLeft);
                btn.dataset.timelineIdealTop  = String(timelineTop);
                btn.dataset.timelineLeft = String(timelineLeft);
                btn.dataset.timelineTop  = String(timelineTop);
            });

            resolveViewOverlaps('timeline');
            buildTimelineGrid();

            document.querySelectorAll('.image-button').forEach(btn => {
                const targetLeft = parseInt(btn.dataset.timelineLeft);
                const targetTop = parseInt(btn.dataset.timelineTop);
                const dx = targetLeft - parseInt(btn.dataset.initLeft);
                const dy = targetTop - parseInt(btn.dataset.initTop);
                btn.style.transition = 'transform 0.5s ease';
                btn.style.transform = `translate(${dx}px, ${dy}px)`;

                const slider = document.querySelector(`input[data-src='${btn.dataset.audioSrc}']`);
                if (slider) {
                    slider.style.transition = 'transform 0.5s ease';
                    positionVolumeSlider(slider, btn, targetTop);
                }
            });

            applyFilters();
        }

        // Build timeline grid SVG elements (lines + labels)
        // Called once after data loads so we know visibleBounds
        function buildTimelineGrid() {
            const { leftBound, rightBound, visibleWidth } = computeVisibleBounds();
            const cellW = visibleWidth / numDays;
            const labelPad = 4;
            const dur = 500;

            // Vertical dividers — animated slide + fade
            const vData = Array.from({ length: numDays - 1 }, (_, i) => leftBound + (i + 1) * cellW);
            timelineGrid.selectAll('.v-divider')
                .data(vData)
                .join(
                    enter => enter.append('line')
                        .attr('class', 'timeline-grid-line v-divider')
                        .attr('y1', 0).attr('y2', height)
                        .attr('x1', d => d).attr('x2', d => d)
                        .style('opacity', 0),
                    update => update,
                    exit => exit.transition().duration(dur / 2).style('opacity', 0).remove()
                )
                .transition().duration(dur).ease(d3.easeQuadInOut)
                .attr('x1', d => d).attr('x2', d => d)
                .style('opacity', 1);

            // Horizontal dividers — static, rebuild
            timelineGrid.selectAll('.h-divider').remove();
            [6, 12, 18].forEach(h => {
                const y = (h / 24) * height;
                timelineGrid.append('line')
                    .attr('class', 'timeline-grid-line h-divider')
                    .attr('x1', leftBound).attr('y1', y)
                    .attr('x2', rightBound).attr('y2', y);
            });

            // Day labels — animated slide + fade, keyed by column index
            const lblData = Array.from({ length: numDays }, (_, i) => ({
                i,
                x: leftBound + i * cellW + cellW / 2,
                text: dayDates[i] || t('day_n').replace('{n}', i + 1)
            }));
            timelineGrid.selectAll('.timeline-day-label')
                .data(lblData, d => d.i)
                .join(
                    enter => enter.append('text')
                        .attr('class', 'timeline-day-label')
                        .attr('y', 30)
                        .attr('x', d => d.x)
                        .style('opacity', 0)
                        .text(d => d.text),
                    update => update.text(d => d.text),
                    exit => exit.transition().duration(dur / 2).style('opacity', 0).remove()
                )
                .transition().duration(dur).ease(d3.easeQuadInOut)
                .attr('x', d => d.x)
                .attr('y', 30)
                .style('opacity', 1);

            // Time-of-day labels — static, rebuild
            timelineGrid.selectAll('.timeline-user-label').remove();
            ['00:00', '06:00', '12:00', '18:00', '24:00'].forEach((label, i) => {
                timelineGrid.append('text')
                    .attr('class', 'timeline-user-label')
                    .attr('x', leftBound + labelPad)
                    .attr('y', i === 0 ? 50 : i === 4 ? height - 8 : (i / 4) * height + 4)
                    .text(label);
            });
        }

        // Build clock quadrant labels
        function buildClockGrid() {
            clockGrid.selectAll("*").remove();
            const { leftBound, visibleWidth } = computeVisibleBounds();
            const cx = leftBound + visibleWidth / 2;
            const cy = height / 2;
            const r  = Math.min(visibleWidth, height) * 0.35;
            const lo = r * 0.65; // label offset from center

            const quadrants = [
                { label: 'Morning',   angle: Math.PI * 0.5  },  // top-right (π/4 from top = 45°)
                { label: 'Afternoon', angle: Math.PI * 1.0  },  // bottom-right
                { label: 'Evening',   angle: Math.PI * 1.5  },  // bottom-left
                { label: 'Night',     angle: Math.PI * 2.0  },  // top-left (= 0 wraps, use 7π/4)
            ];
            // Angles measured clockwise from top: morning=45°, afternoon=135°, evening=225°, night=315°
            const angles = [Math.PI * 0.25, Math.PI * 0.75, Math.PI * 1.25, Math.PI * 1.75];
            const names  = [t('morning'), t('afternoon'), t('evening'), t('night')];

            names.forEach((name, i) => {
                const a = angles[i];
                clockGrid.append("text")
                    .attr("x", cx + lo * Math.sin(a))
                    .attr("y", cy - lo * Math.cos(a) + 4)
                    .attr("text-anchor", "middle")
                    .attr("class", "timeline-day-label")
                    .style("font-size", "clamp(16px, 1.6vw, 24px)")
                    .style("fill", "#777")
                    .text(name);
            });
        }

        // Compute clock position for a button from its time field
        function computeClockPos(img) {
            const { leftBound, visibleWidth } = computeVisibleBounds();
            const cx = leftBound + visibleWidth / 2;
            const cy = height / 2;
            const r  = Math.min(visibleWidth, height) * 0.35;

            // Parse hh:mm
            const parts = (img.time || '12:00').split(':');
            const totalMinutes = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            // 06:00 maps to angle 0 (top), clockwise
            const adjusted = (totalMinutes - 360 + 1440) % 1440;
            const angle = (adjusted / 1440) * 2 * Math.PI;

            const baseX = cx + r * Math.sin(angle);
            const baseY = cy - r * Math.cos(angle);

            // Seeded jitter: consume 4 RNG calls (scatter x/y + timeline jx/jy) then use 2 more
            const idKey = (img.audio || img.src || img.title);
            const rng = seededRngFromString(`${randomSeed}|${idKey}`);
            rng(); rng(); rng(); rng(); // consume prior calls
            const jr = (rng() - 0.5) * 2 * r * 0.12;
            const jt = (rng() - 0.5) * 0.15;

            const clockLeft = Math.round(baseX + jr * Math.sin(angle) + jt * Math.cos(angle) * r - buttonSize / 2);
            const clockTop  = Math.round(baseY - jr * Math.cos(angle) + jt * Math.sin(angle) * r - buttonSize / 2);

            return { clockLeft, clockTop };
        }

        // Compute timeline position for a button (X = day column, Y = time of day)
        function computeTimelinePos(img) {
            const { leftBound, visibleWidth } = computeVisibleBounds();
            const cellW = visibleWidth / numDays;
            const dateIdx = currentWeekMDDates.indexOf(img.date);
            const dIdx = dateIdx >= 0 ? dateIdx : Math.max(0, parseInt(img.day, 10) - 1);

            // X: center button in its day column
            const baseLeft = leftBound + dIdx * cellW + (cellW - buttonSize) / 2;

            // Y: map hh:mm → 0–1440 minutes → pixel position
            const parts = (img.time || '12:00').split(':');
            const totalMinutes = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            const baseTop = (totalMinutes / 1440) * height - buttonSize / 2;

            // Seeded jitter: consume scatter x/y, use 3rd call for horizontal jitter only
            const idKey = (img.audio || img.src || img.title);
            const rng = seededRngFromString(`${randomSeed}|${idKey}`);
            rng(); rng();
            const jx = (rng() - 0.5) * 2 * cellW * 0.2;
            rng(); // consume 4th call (clock view uses calls 5&6)

            return {
                timelineLeft: Math.round(baseLeft + jx),
                timelineTop:  Math.round(baseTop)
            };
        }

        // Tag cluster constants
        const MAIN_TAGS = ['on_the_way', 'open_space', 'commercial', 'historical'];
        const MAIN_TAG_QUADRANTS = [
            { col: 0, row: 0 },
            { col: 1, row: 0 },
            { col: 0, row: 1 },
            { col: 1, row: 1 },
        ];
        let tagCenters = {};

        function buildTagCenters(images) {
            const { leftBound, visibleWidth } = computeVisibleBounds();
            const colW = visibleWidth / 2;
            const rowH = height / 2;
            tagCenters = {};
            MAIN_TAGS.forEach((tag, i) => {
                const { col, row } = MAIN_TAG_QUADRANTS[i];
                tagCenters[tag] = {
                    cx: leftBound + (col + 0.5) * colW,
                    cy: (row + 0.5) * rowH,
                };
            });
            const extraTags = [...new Set(images.map(img => img.tag).filter(t => t && !MAIN_TAGS.includes(t)))];
            extraTags.forEach(tag => {
                const rng = seededRngFromString('tag-center|' + tag);
                const anchor = tagCenters[MAIN_TAGS[Math.floor(rng() * 4)]];
                const offsetR = Math.min(colW, rowH) * 0.25;
                tagCenters[tag] = {
                    cx: anchor.cx + (rng() - 0.5) * 2 * offsetR,
                    cy: anchor.cy + (rng() - 0.5) * 2 * offsetR,
                };
            });
        }

        function buildTagGrid() {
            tagGrid.selectAll("*").remove();
            Object.entries(tagCenters).forEach(([tag, { cx, cy }]) => {
                tagGrid.append("text")
                    .attr("x", cx)
                    .attr("y", cy)
                    .attr("text-anchor", "middle")
                    .attr("class", "timeline-day-label")
                    .style("font-size", "clamp(16px, 1.6vw, 24px)")
                    .style("fill", "#777")
                    .text(tagLabel(tag));
            });
        }

        function computeTagPos(img, initLeft, initTop) {
            const tag = img.tag || '';
            const center = tagCenters[tag];
            if (!center) return { tagLeft: initLeft, tagTop: initTop };
            const { visibleWidth } = computeVisibleBounds();
            const clusterR = (visibleWidth / 2) * 0.28;
            const idKey = img.audio || img.src || img.title || '';
            const rng = seededRngFromString(`tag-jitter|${randomSeed}|${idKey}`);
            return {
                tagLeft: Math.round(center.cx + (rng() - 0.5) * 2 * clusterR - buttonSize / 2),
                tagTop:  Math.round(center.cy + (rng() - 0.5) * 2 * clusterR - buttonSize / 2),
            };
        }

        // Feel cluster functions
        const FEEL_CATEGORIES = ['愉悦/满足', '烦躁/压抑', '焦虑/紧张', '平静/放松', '热闹/有生机', '感慨/联想'];
        const FEEL_CATEGORY_KEYS = ['feel_cat_pleased', 'feel_cat_irritated', 'feel_cat_anxious', 'feel_cat_calm', 'feel_cat_lively', 'feel_cat_moved'];
        let feelCenters = {};
        let feelClusterR = 0;
        const buttonsLayerEl    = document.getElementById('buttons-layer');
        const feelLabelsLayerEl = document.getElementById('feel-labels-layer');

        function buildFeelCenters(images) {
            const { leftBound, visibleWidth } = computeVisibleBounds();
            const colW = visibleWidth / 2;
            const rowH = height / 3;
            feelClusterR = Math.min(colW, rowH) * 0.3;
            feelCenters = {};
            const known = new Set(FEEL_CATEGORIES);
            FEEL_CATEGORIES.forEach((feel, i) => {
                feelCenters[feel] = {
                    cx: leftBound + (i % 2 + 0.5) * colW,
                    cy: (Math.floor(i / 2) + 0.5) * rowH,
                };
            });
            [...new Set(images.map(img => img.feel_category).filter(f => f && !known.has(f)))].forEach(feel => {
                const rng = seededRngFromString('feel-center|' + feel);
                feelCenters[feel] = {
                    cx: leftBound + rng() * visibleWidth,
                    cy: rng() * height,
                };
            });
        }

        function buildFeelGrid() {
            feelLabelsLayerEl.innerHTML = '';
            Object.entries(feelCenters).forEach(([feel, { cx, cy }]) => {
                const el = document.createElement('div');
                el.className = 'feel-label';
                const keyIdx = FEEL_CATEGORIES.indexOf(feel);
                el.textContent = keyIdx >= 0 ? t(FEEL_CATEGORY_KEYS[keyIdx]) : feel;
                el.style.left = cx + 'px';
                el.style.top  = cy + 'px';
                feelLabelsLayerEl.appendChild(el);
            });
        }

        function computeFeelPos(img, initLeft, initTop) {
            const feel = img.feel_category || '';
            const center = feelCenters[feel];
            if (!center) return { feelLeft: initLeft, feelTop: initTop };
            const idKey = img.audio || img.src || img.title || '';
            const rng = seededRngFromString(`feel-jitter|${randomSeed}|${idKey}`);
            return {
                feelLeft: Math.round(center.cx + (rng() - 0.5) * 2 * feelClusterR - buttonSize / 2),
                feelTop:  Math.round(center.cy + (rng() - 0.5) * 2 * feelClusterR - buttonSize / 2),
            };
        }

        // View state
        let currentView = 'timeline';

        function setView(view) {
            svg.call(zoom.transform, d3.zoomIdentity);
            feelLabelsLayerEl.style.transform = '';
            document.querySelectorAll('input[data-src]').forEach(s => s.style.display = 'none');
            currentView = view;
            const isTimeline = view === 'timeline';
            const isClock    = view === 'clock';
            const isTag      = view === 'tag';
            const isFeel     = view === 'feel';

            if (isTimeline) buildTimelineGrid();
            if (isClock)    buildClockGrid();
            if (isTag)      buildTagGrid();
            if (isFeel)     buildFeelGrid();

            timelineGrid.style("display", isTimeline ? null : "none");
            clockGrid.style("display",    isClock    ? null : "none");
            tagGrid.style("display",      isTag      ? null : "none");
            feelGrid.style("display",     "none");
            feelLabelsLayerEl.style.display = isFeel ? 'block' : 'none';

            document.querySelectorAll(".image-button").forEach(btn => {
                let targetLeft, targetTop;
                if (isTimeline) {
                    targetLeft = parseInt(btn.dataset.timelineLeft);
                    targetTop  = parseInt(btn.dataset.timelineTop);
                } else if (isClock) {
                    targetLeft = parseInt(btn.dataset.clockLeft);
                    targetTop  = parseInt(btn.dataset.clockTop);
                } else if (isTag) {
                    targetLeft = parseInt(btn.dataset.tagLeft);
                    targetTop  = parseInt(btn.dataset.tagTop);
                } else if (isFeel) {
                    targetLeft = parseInt(btn.dataset.feelLeft);
                    targetTop  = parseInt(btn.dataset.feelTop);
                } else {
                    targetLeft = parseInt(btn.dataset.initLeft);
                    targetTop  = parseInt(btn.dataset.initTop);
                }
                const dx = targetLeft - parseInt(btn.dataset.initLeft);
                const dy = targetTop  - parseInt(btn.dataset.initTop);
                btn.style.transition = 'transform 0.5s ease';
                btn.style.transform  = `translate(${dx}px, ${dy}px)`;

                const audioSrc = btn.dataset.audioSrc;
                if (audioSrc) {
                    const slider = document.querySelector(`input[data-src='${audioSrc}']`);
                    if (slider) {
                        slider.style.transition = 'transform 0.5s ease';
                        positionVolumeSlider(slider, btn, targetTop);
                    }
                }
            });

            document.getElementById('view-scatter').classList.toggle('active', view === 'scatter');
            document.getElementById('view-timeline').classList.toggle('active', isTimeline);
            document.getElementById('view-clock').classList.toggle('active', isClock);
            document.getElementById('view-tag').classList.toggle('active', isTag);
            document.getElementById('view-feel').classList.toggle('active', isFeel);

            const weekNav = document.getElementById('week-nav');
            if (weekNav) weekNav.style.display = isTimeline ? 'flex' : 'none';

            applyFilters();
        }

        document.getElementById('view-scatter').addEventListener('click', () => setView('scatter'));
        document.getElementById('view-timeline').addEventListener('click', () => setView('timeline'));
        document.getElementById('view-clock').addEventListener('click', () => setView('clock'));
        document.getElementById('view-tag').addEventListener('click', () => setView('tag'));
        document.getElementById('view-feel').addEventListener('click', () => setView('feel'));

        let currentFilter = 'me';

        function resolveDefaultCity() {
            const raw = (localStorage.getItem('usd_city') || '').toLowerCase().trim();
            if (raw === 'shenzhen' || raw === '深圳') return 'shenzhen';
            return 'suzhou';
        }
        let currentCityFilter = resolveDefaultCity();

        function positionVisibleTimelineMoments() {
            resolveViewOverlaps('timeline', true);
            document.querySelectorAll('.image-button').forEach(btn => {
                if (btn.style.display === 'none') return;
                const targetLeft = parseInt(btn.dataset.timelineLeft);
                const targetTop = parseInt(btn.dataset.timelineTop);
                const dx = targetLeft - parseInt(btn.dataset.initLeft);
                const dy = targetTop - parseInt(btn.dataset.initTop);
                btn.style.transition = 'transform 0.35s ease';
                btn.style.transform = `translate(${dx}px, ${dy}px)`;

                const audioSrc = btn.dataset.audioSrc;
                const slider = audioSrc
                    ? document.querySelector(`input[data-src='${audioSrc}']`)
                    : null;
                if (slider && slider.style.display !== 'none') {
                    slider.style.transition = 'transform 0.35s ease';
                    positionVolumeSlider(slider, btn, targetTop);
                }
            });
        }

        function applyFilters() {
            document.querySelectorAll('.image-button').forEach(btn => {
                const u = btn.dataset.user;
                const c = btn.dataset.city;
                const userMatch = currentFilter === 'all'
                    ? true
                    : currentFilter === 'me'
                    ? u === currentUser
                    : u !== currentUser;
                const cn = (c || '').toLowerCase().trim();
                let cityMatch;
                if (!cn) {
                    cityMatch = true;
                } else if (currentCityFilter === 'two-cities') {
                    cityMatch = cn === 'suzhou' || cn === 'shenzhen';
                } else {
                    cityMatch = cn === currentCityFilter;
                }
                const favMatch = currentFavFilter === 'all'
                    ? true
                    : btn.dataset.fav === 'true';
                const dateMatch = currentView !== 'timeline' || currentWeekMDDates.includes(btn.dataset.date);
                const match = userMatch && cityMatch && favMatch && dateMatch;
                btn.style.display = match ? '' : 'none';
                const audioSrc = btn.dataset.audioSrc;
                if (audioSrc) {
                    const slider = document.querySelector(`input[data-src='${audioSrc}']`);
                    if (slider && !match) slider.style.display = 'none';
                }
            });
            if (currentView === 'timeline') positionVisibleTimelineMoments();
        }

        function setFilter(mode) {
            currentFilter = mode;
            document.querySelectorAll('#user-filter-buttons .view-btn').forEach(btn => {
                btn.classList.toggle('active',
                    (mode === 'all'    && btn.id === 'filter-all') ||
                    (mode === 'me'     && btn.id === 'filter-me') ||
                    (mode === 'others' && btn.id === 'filter-others')
                );
            });
            applyFilters();
        }

        function setCityFilter(mode) {
            currentCityFilter = mode;
            document.querySelectorAll('#city-filter-buttons .view-btn').forEach(btn => {
                btn.classList.toggle('active',
                    (mode === 'two-cities' && btn.id === 'filter-two-cities') ||
                    (mode === 'suzhou'     && btn.id === 'filter-suzhou') ||
                    (mode === 'shenzhen'   && btn.id === 'filter-shenzhen')
                );
            });
            applyFilters();
        }

        document.getElementById('filter-me').addEventListener('click',         () => setFilter('me'));
        document.getElementById('filter-all').addEventListener('click',        () => setFilter('all'));
        document.getElementById('filter-others').addEventListener('click',     () => setFilter('others'));
        document.getElementById('filter-suzhou').addEventListener('click',     () => setCityFilter('suzhou'));
        document.getElementById('filter-two-cities').addEventListener('click', () => setCityFilter('two-cities'));
        document.getElementById('filter-shenzhen').addEventListener('click',   () => setCityFilter('shenzhen'));
        setCityFilter(currentCityFilter);

        function setFavFilter(mode) {
            currentFavFilter = mode;
            document.querySelectorAll('#fav-filter-buttons .view-btn').forEach(btn => {
                btn.classList.toggle('active',
                    (mode === 'all'      && btn.id === 'filter-all-fav') ||
                    (mode === 'fav-only' && btn.id === 'filter-fav-only')
                );
            });
            applyFilters();
        }

        function updateFavButton(isFav) {
            const btn = document.getElementById('fav-toggle');
            btn.textContent = isFav ? t('fav_added') : t('fav_add');
            btn.classList.toggle('active', isFav);
        }

        document.getElementById('filter-all-fav').addEventListener('click',  () => setFavFilter('all'));
        document.getElementById('filter-fav-only').addEventListener('click', () => setFavFilter('fav-only'));

        document.getElementById('fav-toggle').addEventListener('click', () => {
            if (!selectedAudioSrc) return;
            const favs = getFavorites();
            if (favs.has(selectedAudioSrc)) {
                favs.delete(selectedAudioSrc);
            } else {
                favs.add(selectedAudioSrc);
            }
            saveFavorites(favs);
            updateFavButton(favs.has(selectedAudioSrc));
            const imgBtn = document.querySelector(`.image-button[data-audio-src='${selectedAudioSrc}']`);
            if (imgBtn) imgBtn.dataset.fav = favs.has(selectedAudioSrc) ? 'true' : 'false';
            if (currentFavFilter !== 'all') applyFilters();
        });

        d3.csv("/api/moments/csv").catch(() => [])
        .then((liveImages) => {
            const images = liveImages.map(img => ({ ...img, tag: normalizeTag(img.tag || '') }));

            buildTagCenters(images);
            buildFeelCenters(images);

            {
            const maxSize = buttonSize;
            const sizeFromArea = Math.floor(Math.sqrt(width * height * 0.25 / images.length));
            buttonSize = Math.max(24, Math.min(maxSize, sizeFromArea));
            }

            {
            const { leftBound, rightBound } = computeVisibleBounds();
            images.forEach((img, index) => {
                const button = document.createElement("button");
                button.style.position = "absolute";
                const padding = 10;
                const minLeft = leftBound + padding;
                const maxLeft = rightBound - buttonSize - padding;
                const minTop = padding;
                const maxTop = height - buttonSize - padding;

                const idKey = (img.audio || img.src || String(index));
                const rng = seededRngFromString(`${randomSeed}|${idKey}`);
                const xRand = rng();
                const yRand = rng();
                const computedLeft = Math.floor(minLeft + (maxLeft - minLeft) * xRand);
                const computedTop  = Math.floor(minTop  + (maxTop  - minTop)  * yRand);

                const dIdx = Math.max(0, parseInt(img.day, 10) - 1);

                const { timelineLeft, timelineTop } = computeTimelinePos(img);
                const { clockLeft, clockTop }       = computeClockPos(img);
                const { tagLeft, tagTop }           = computeTagPos(img, computedLeft, computedTop);
                const { feelLeft, feelTop }         = computeFeelPos(img, computedLeft, computedTop);

                button.classList.add("image-button");
                button._imgData             = img;
                button.dataset.initLeft     = String(computedLeft);
                button.dataset.initTop      = String(computedTop);
                button.dataset.timelineIdealLeft = String(timelineLeft);
                button.dataset.timelineIdealTop  = String(timelineTop);
                button.dataset.timelineLeft = String(timelineLeft);
                button.dataset.timelineTop  = String(timelineTop);
                button.dataset.clockLeft    = String(clockLeft);
                button.dataset.clockTop     = String(clockTop);
                button.dataset.tagLeft      = String(tagLeft);
                button.dataset.tagTop       = String(tagTop);
                button.dataset.feelLeft     = String(feelLeft);
                button.dataset.feelTop      = String(feelTop);
                button.dataset.feelCategory = img.feel_category || '';
                button.dataset.audioSrc     = img.audio;
                button.dataset.user         = img.user;
                button.dataset.city         = img.city || '';
                button.dataset.fav          = getFavorites().has(img.audio) ? 'true' : 'false';
                button.dataset.date         = img.date || '';
                button.style.left   = `${computedLeft}px`;
                button.style.top    = `${computedTop}px`;
                button.style.width  = `${buttonSize}px`;
                button.style.height = `${buttonSize}px`;
                if (img.src) button.style.backgroundImage = `url(${img.src})`;
                button.style.opacity = 0.5;

                let pointerDragging = false;
                button.addEventListener("pointerdown", (event) => {
                    event.preventDefault();
                    if (currentView !== 'scatter') return;
                    pointerDragging = false;
                    const startX = event.clientX;
                    const startY = event.clientY;
                    const m = new DOMMatrix(getComputedStyle(button).transform);
                    const baseDx = m.m41;
                    const baseDy = m.m42;
                    button.setPointerCapture(event.pointerId);

                    const onMove = (e) => {
                        const scale = currentView === 'timeline' ? 1 : zoomTransform.k;
                        const dx = (e.clientX - startX) / scale;
                        const dy = (e.clientY - startY) / scale;
                        if (!pointerDragging && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
                            pointerDragging = true;
                        }
                        if (pointerDragging) {
                            button.style.transition = 'none';
                            button.style.transform  = `translate(${baseDx + dx}px, ${baseDy + dy}px)`;
                            const slider = document.querySelector(`input[data-src='${img.audio}']`);
                            if (slider) {
                                slider.style.transition = 'none';
                                slider.style.transform  = `translate(${baseDx + dx}px, ${baseDy + dy}px)`;
                            }
                        }
                    };
                    const onUp = () => {
                        button.removeEventListener("pointermove", onMove);
                        button.removeEventListener("pointerup",   onUp);
                        const slider = document.querySelector(`input[data-src='${img.audio}']`);
                        if (slider) positionVolumeSlider(slider, button);
                    };
                    button.addEventListener("pointermove", onMove);
                    button.addEventListener("pointerup",   onUp);
                });

                button.addEventListener("click", () => {
                    if (pointerDragging) return;
                    if (!sidebar1Visible) {
                        sidebar1Visible = false;
                        sidebar1.classed("hidden", true);
                    }
                    if (!sidebar2Visible) {
                        sidebar2Visible = false;
                        sidebar2.classed("hidden", true);
                    }
                    const dateLabel = img.date ? (() => {
                        const [mm, dd] = img.date.split('-').map(Number);
                        return new Date(new Date().getFullYear(), mm - 1, dd)
                            .toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    })() : '';
                    document.getElementById('participant-id-value').textContent = img.user || currentUser;
                    document.getElementById('moment-details-heading').hidden = false;
                    const timeText = [dateLabel, img.time].filter(Boolean).join(' · ');
                    d3.select("#image-time").html(timeText ? `<p>${timeText}</p>` : '');
                    d3.select("#image-bgc").html(img.bgc ? `<img src="${img.bgc}" class="selected-image">` : '');
                    const hearPart  = img.hear     ? `<p><strong>${t('what_i_hear')}</strong><br>${img.hear}</p>` : '';
                    const feelPart  = img.feel     ? `<p><strong>${t('what_i_feel')}</strong><br>${img.feel}</p>` : '';
                    const locPart   = img.location ? `<p><strong>${t('location_label')}</strong><br>${img.location}</p>` : '';
                    const tagPart   = img.tag      ? `<p><strong>${t('tag_label')}</strong><br>${tagLabel(img.tag)}</p>` : '';
                    d3.select("#image-describ").html(hearPart + feelPart + locPart + tagPart);

                    selectedAudioSrc = img.audio;
                    document.getElementById('fav-toggle-wrap').style.display = '';
                    updateFavButton(getFavorites().has(img.audio));

                    document.querySelectorAll('#sidebar1 .audio-control-group, #sidebar1 .audio-controls-heading').forEach(element => element.remove());
                    let existingAudio  = document.querySelector(`audio[data-src='${img.audio}']`);
                    let volumeSlider   = document.querySelector(`input[data-src='${img.audio}']`);
                    let panLabel       = document.querySelector(`label[data-pan-src='${img.audio}']`);
                    let leftLabel      = document.querySelector(`label[data-left-src='${img.audio}']`);
                    let panSlider      = document.querySelector(`input[data-pan-src='${img.audio}']`);
                    let rightLabel     = document.querySelector(`label[data-right-src='${img.audio}']`);
                    let lowpassLabel   = document.querySelector(`label[data-low-src='${img.audio}']`);
                    let lowpassSlider  = document.querySelector(`input[data-lowpass-src='${img.audio}']`);
                    let highpassLabel  = document.querySelector(`label[data-high-src='${img.audio}']`);
                    let highpassSlider = document.querySelector(`input[data-highpass-src='${img.audio}']`);

                    document.querySelectorAll("label[data-pan-src]").forEach(label => {
                        document.getElementById("sidebar1").removeChild(label);
                    });
                    document.querySelectorAll("label[data-left-src]").forEach(label => {
                        document.getElementById("sidebar1").removeChild(label);
                    });
                    document.querySelectorAll("input[data-pan-src]").forEach(slider => {
                        document.getElementById("sidebar1").removeChild(slider);
                    });
                    document.querySelectorAll("label[data-right-src]").forEach(label => {
                        document.getElementById("sidebar1").removeChild(label);
                    });
                    document.querySelectorAll("label[data-low-src]").forEach(label => {
                        document.getElementById("sidebar1").removeChild(label);
                    });
                    document.querySelectorAll("input[data-lowpass-src]").forEach(slider => {
                        document.getElementById("sidebar1").removeChild(slider);
                    });
                    document.querySelectorAll("label[data-high-src]").forEach(label => {
                        document.getElementById("sidebar1").removeChild(label);
                    });
                    document.querySelectorAll("input[data-highpass-src]").forEach(slider => {
                        document.getElementById("sidebar1").removeChild(slider);
                    });

                    if (!existingAudio) {
                        let audioElement = document.createElement("audio");
                        audioElement.src = img.audio;
                        audioElement.setAttribute("data-src", img.audio);
                        audioElement.loop = true;
                        audioElement.volume = 1;
                        document.body.appendChild(audioElement);
                        audioElement.play();
                        button.dataset.playing = 'true';
                        button.style.animation = "pulse 2s infinite";

                        let slider = document.createElement("input");
                        slider.type = "range";
                        slider.min = "0";
                        slider.max = "1";
                        slider.step = "0.01";
                        slider.value = "1";
                        slider.setAttribute("data-src", img.audio);
                        positionVolumeSlider(slider, button);
                        document.getElementById("canvas-container").appendChild(slider);

                        slider.addEventListener("input", (event) => {
                            audioElement.volume = event.target.value;
                        });

                        let panLabelEl = document.createElement("label");
                        panLabelEl.innerText = "PAN";
                        panLabelEl.style.fontFamily = "ark-pixel";
                        panLabelEl.style.display = "block";
                        panLabelEl.setAttribute("data-pan-src", img.audio);
                        document.getElementById("sidebar1").appendChild(panLabelEl);

                        let leftLabelEl = document.createElement("label");
                        leftLabelEl.innerText = "left";
                        leftLabelEl.style.fontFamily = "ark-pixel";
                        leftLabelEl.setAttribute("data-left-src", img.audio);
                        document.getElementById("sidebar1").appendChild(leftLabelEl);

                        let panSliderEl = document.createElement("input");
                        panSliderEl.type = "range";
                        panSliderEl.min = "-1";
                        panSliderEl.max = "1";
                        panSliderEl.step = "0.01";
                        panSliderEl.value = "0";
                        panSliderEl.setAttribute("data-pan-src", img.audio);
                        panSliderEl.classList.add("control-slider");
                        document.getElementById("sidebar1").appendChild(panSliderEl);

                        let rightLabelEl = document.createElement("label");
                        rightLabelEl.innerText = "right";
                        rightLabelEl.style.fontFamily = "ark-pixel";
                        rightLabelEl.setAttribute("data-right-src", img.audio);
                        document.getElementById("sidebar1").appendChild(rightLabelEl);

                        let lowpassLabelEl = document.createElement("label");
                        lowpassLabelEl.innerText = "LOWPASS FILTER";
                        lowpassLabelEl.style.fontFamily = "ark-pixel";
                        lowpassLabelEl.style.display = "block";
                        lowpassLabelEl.setAttribute("data-low-src", img.audio);
                        document.getElementById("sidebar1").appendChild(lowpassLabelEl);

                        let lowpassSliderEl = document.createElement("input");
                        lowpassSliderEl.type = "range";
                        lowpassSliderEl.min = "1";
                        lowpassSliderEl.max = "10000";
                        lowpassSliderEl.step = "1";
                        lowpassSliderEl.value = "8000";
                        lowpassSliderEl.setAttribute("data-lowpass-src", img.audio);
                        lowpassSliderEl.classList.add("control-slider");
                        document.getElementById("sidebar1").appendChild(lowpassSliderEl);

                        let highpassLabelEl = document.createElement("label");
                        highpassLabelEl.innerText = "HIGHPASS FILTER";
                        highpassLabelEl.style.fontFamily = "ark-pixel";
                        highpassLabelEl.style.display = "block";
                        highpassLabelEl.setAttribute("data-high-src", img.audio);
                        document.getElementById("sidebar1").appendChild(highpassLabelEl);

                        let highpassSliderEl = document.createElement("input");
                        highpassSliderEl.type = "range";
                        highpassSliderEl.min = "1";
                        highpassSliderEl.max = "5000";
                        highpassSliderEl.step = "1";
                        highpassSliderEl.value = "1000";
                        highpassSliderEl.setAttribute("data-highpass-src", img.audio);
                        highpassSliderEl.classList.add("control-slider");
                        document.getElementById("sidebar1").appendChild(highpassSliderEl);

                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const track = audioContext.createMediaElementSource(audioElement);
                        const panner = new StereoPannerNode(audioContext, { pan: 0 });
                        const lowpassFilter  = new BiquadFilterNode(audioContext, { type: 'lowpass',  frequency: 8000 });
                        const highpassFilter = new BiquadFilterNode(audioContext, { type: 'highpass', frequency: 1000 });
                        track.connect(panner).connect(lowpassFilter).connect(highpassFilter).connect(audioContext.destination);

                        panSliderEl.addEventListener("input", (event) => {
                            panner.pan.value = event.target.value;
                        });
                        lowpassSliderEl.addEventListener("input", (event) => {
                            lowpassFilter.frequency.value = event.target.value;
                        });
                        highpassSliderEl.addEventListener("input", (event) => {
                            highpassFilter.frequency.value = event.target.value;
                        });

                        audioElement.panner        = panner;
                        audioElement.lowpassFilter  = lowpassFilter;
                        audioElement.highpassFilter = highpassFilter;
                    } else {
                        // Toggle play/pause on the same button; other moments are unaffected
                        if (existingAudio.paused) {
                            existingAudio.currentTime = 0;
                            existingAudio.play();
                            button.dataset.playing = 'true';
                            button.style.animation = "pulse 2s infinite";

                            // Volume slider: show or create
                            if (volumeSlider) {
                                positionVolumeSlider(volumeSlider, button);
                                volumeSlider.style.display = '';
                            } else {
                                let slider = document.createElement("input");
                                slider.type = "range";
                                slider.min = "0"; slider.max = "1"; slider.step = "0.01"; slider.value = "1";
                                slider.setAttribute("data-src", img.audio);
                                positionVolumeSlider(slider, button);
                                document.getElementById("canvas-container").appendChild(slider);
                                slider.addEventListener("input", (event) => { existingAudio.volume = event.target.value; });
                            }
                        } else {
                            existingAudio.pause();
                            button.dataset.playing = 'false';
                            button.style.animation = "";
                            button.style.opacity = 0.5;
                            if (volumeSlider) { volumeSlider.style.display = "none"; }
                        }

                        // Pan/filter controls: always create fresh (removed at top of handler)
                        let panLabelEl = document.createElement("label");
                        panLabelEl.innerText = "PAN";
                        panLabelEl.style.fontFamily = "ark-pixel"; panLabelEl.style.display = "block";
                        panLabelEl.setAttribute("data-pan-src", img.audio);
                        document.getElementById("sidebar1").appendChild(panLabelEl);

                        let leftLabelEl = document.createElement("label");
                        leftLabelEl.innerText = "left";
                        leftLabelEl.style.fontFamily = "ark-pixel";
                        leftLabelEl.setAttribute("data-left-src", img.audio);
                        document.getElementById("sidebar1").appendChild(leftLabelEl);

                        let panSliderEl = document.createElement("input");
                        panSliderEl.type = "range"; panSliderEl.min = "-1"; panSliderEl.max = "1"; panSliderEl.step = "0.01";
                        panSliderEl.value = existingAudio.panner.pan.value;
                        panSliderEl.setAttribute("data-pan-src", img.audio);
                        panSliderEl.classList.add("control-slider");
                        document.getElementById("sidebar1").appendChild(panSliderEl);

                        let rightLabelEl = document.createElement("label");
                        rightLabelEl.innerText = "right";
                        rightLabelEl.style.fontFamily = "ark-pixel";
                        rightLabelEl.setAttribute("data-right-src", img.audio);
                        document.getElementById("sidebar1").appendChild(rightLabelEl);

                        panSliderEl.addEventListener("input", (event) => { existingAudio.panner.pan.value = event.target.value; });

                        let lowpassLabelEl = document.createElement("label");
                        lowpassLabelEl.innerText = "LOWPASS FILTER";
                        lowpassLabelEl.style.fontFamily = "ark-pixel"; lowpassLabelEl.style.display = "block";
                        lowpassLabelEl.setAttribute("data-low-src", img.audio);
                        document.getElementById("sidebar1").appendChild(lowpassLabelEl);

                        let lowpassSliderEl = document.createElement("input");
                        lowpassSliderEl.type = "range"; lowpassSliderEl.min = "1"; lowpassSliderEl.max = "10000"; lowpassSliderEl.step = "1";
                        lowpassSliderEl.value = existingAudio.lowpassFilter.frequency.value;
                        lowpassSliderEl.setAttribute("data-lowpass-src", img.audio);
                        lowpassSliderEl.classList.add("control-slider");
                        document.getElementById("sidebar1").appendChild(lowpassSliderEl);

                        lowpassSliderEl.addEventListener("input", (event) => { existingAudio.lowpassFilter.frequency.value = event.target.value; });

                        let highpassLabelEl = document.createElement("label");
                        highpassLabelEl.innerText = "HIGHPASS FILTER";
                        highpassLabelEl.style.fontFamily = "ark-pixel"; highpassLabelEl.style.display = "block";
                        highpassLabelEl.setAttribute("data-high-src", img.audio);
                        document.getElementById("sidebar1").appendChild(highpassLabelEl);

                        let highpassSliderEl = document.createElement("input");
                        highpassSliderEl.type = "range"; highpassSliderEl.min = "1"; highpassSliderEl.max = "5000"; highpassSliderEl.step = "1";
                        highpassSliderEl.value = existingAudio.highpassFilter.frequency.value;
                        highpassSliderEl.setAttribute("data-highpass-src", img.audio);
                        highpassSliderEl.classList.add("control-slider");
                        document.getElementById("sidebar1").appendChild(highpassSliderEl);

                        highpassSliderEl.addEventListener("input", (event) => { existingAudio.highpassFilter.frequency.value = event.target.value; });
                    }
                    requestAnimationFrame(arrangeControlGroups);
                });

                document.getElementById("buttons-layer").appendChild(button);
            });
            ['scatter', 'timeline', 'clock', 'tag', 'feel'].forEach(resolveViewOverlaps);
            setView('timeline');
            applyFilters();
            setTimelineWindow(0, numDays);
            }
        });

        window.i18n.applyTranslations();
        window.addEventListener('langchange', () => {
            window.i18n.applyTranslations();
            if (currentView !== 'scatter') setView(currentView);
            if (selectedAudioSrc) updateFavButton(getFavorites().has(selectedAudioSrc));
        });

    </script>
</body>
</html>
