<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Sound Diary</title>
    <link rel="stylesheet" href="/src/style/home.css">
    <script src="/src/i18n.js"></script>
</head>
<body>
    <div class="lang-switcher">
        <button class="lang-btn" data-lang="en">EN</button>
        <span class="lang-sep">|</span>
        <button class="lang-btn" data-lang="zh">中</button>
    </div>

    <div class="main-container">

        <div class="content-container">
            <div class="welcome-container">
                <h1 data-i18n="app_title">Urban Sound Diary</h1>
                <p data-i18n="tagline">Listen, collect, and share your city.</p>

                <!-- Username Input Section -->
                <div class="username-section">
                    <div id="profile-inputs">
                        <div class="username-input-group">
                            <input type="text" id="username-input" data-i18n-placeholder="username_placeholder" placeholder="Username" maxlength="20">
                            <input type="text" id="city-input" data-i18n-placeholder="city_placeholder" placeholder="City (e.g. Suzhou)" maxlength="40">
                            <button id="set-username-btn" onclick="setUsername()" data-i18n="set">Set</button>
                        </div>
                    </div>
                    <div id="current-username-display" style="display: none;">
                        <span><strong id="username-display-text"></strong> · <span id="city-display-text"></span></span>
                        <button onclick="changeUsername()" class="change-btn" data-i18n="change">Change</button>
                    </div>
                </div>

                <div class="navigation-buttons">
                    <a href="/diary" class="start-button" data-i18n="start_listening">Start Listening</a>
                    <a href="/compose" class="start-button" data-i18n="compose">City Archive</a>
                </div>
            </div>
        </div>



        <!-- Camera Modal -->
        <div id="camera-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <video id="camera-preview" autoplay playsinline></video>
                <canvas id="photo-canvas" style="display: none;"></canvas>
                <div class="camera-controls">
                    <button id="take-photo">Take Photo</button>
                    <button id="retake-photo" style="display: none;">Retake</button>
                    <button id="save-photo" style="display: none;">Save</button>
                    <button id="close-camera">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Init i18n and switcher
        window.i18n.applyTranslations();
        document.querySelectorAll('.lang-btn').forEach(function(btn) {
            btn.addEventListener('click', function() { window.i18n.setLang(btn.getAttribute('data-lang')); });
        });

        // Check for existing username on page load
        window.onload = function() {
            const savedUsername = localStorage.getItem('usd_username');
            const savedCity = localStorage.getItem('usd_city');
            if (savedUsername) {
                showCurrentProfile(savedUsername, savedCity);
            }
        };

        function setUsername() {
            const username = document.getElementById('username-input').value.trim();
            const city = document.getElementById('city-input').value.trim();

            if (!username) {
                alert(window.i18n.t('alert_enter_username'));
                return;
            }

            localStorage.setItem('usd_username', username);
            localStorage.setItem('usd_city', city);

            document.getElementById('username-input').value = '';
            document.getElementById('city-input').value = '';

            showCurrentProfile(username, city);
        }

        function showCurrentProfile(username, city) {
            document.getElementById('profile-inputs').style.display = 'none';
            document.getElementById('current-username-display').style.display = 'block';
            document.getElementById('username-display-text').textContent = username;
            document.getElementById('city-display-text').textContent = city || window.i18n.t('no_city_set');
        }

        function changeUsername() {
            localStorage.removeItem('usd_username');
            localStorage.removeItem('usd_city');
            document.getElementById('profile-inputs').style.display = 'block';
            document.getElementById('current-username-display').style.display = 'none';
            document.getElementById('username-input').focus();
        }

        document.getElementById('username-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('city-input').focus();
        });
        document.getElementById('city-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') setUsername();
        });
    </script>
</body>
</html>
